<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM 返信の承認</title>
<style>
:root{
  /* ---- B案：実務ダッシュボード ----
   * 数字で滞留を見せ、行を詰めて一覧性を上げる配色。
   * 色は「状態」にだけ使い、それ以外は無彩色で静かに保ちます。 */
  --ink:#16181d;
  --ink-2:#5f6570;
  --ink-3:#8b909a;
  --paper:#f4f5f7;
  --card:#ffffff;
  --g1:#eef0f3;
  --g2:#dfe2e7;
  --g3:#c9ced6;
  --line:#e3e6ea;
  --line-2:#eef0f3;
  --accent:#3350c9;
  --accent-d:#263a9c;
  --late:#c2352a;
  --warn:#a8690c;
  --warn-bar:#e0a33c;
  --bd:1px solid var(--g2);
  --sh:0 1px 2px rgba(22,24,29,.04);
  --sh-lift:0 2px 8px rgba(22,24,29,.09);
  --r:5px;
  --r-sm:4px;
  --radius:5px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:14px; line-height:1.75; font-weight:400;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 0 60px}

/* ---- 見出し ---- */
header{
  position:sticky; top:0; z-index:10;
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  margin-bottom:0;
}
.hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 14px 10px}
h1{font-size:14px;margin:0;letter-spacing:.02em;font-weight:700;flex:1}
.badge{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.04em;
  background:#fdf7ea;color:var(--warn);border:1px solid #e6d3ad;white-space:nowrap;
}
.badge.live{background:var(--ink);color:#fff;border-color:var(--ink)}

/* いま何件たまっているか。まずこれを見せます */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-2)}
.stat{display:flex;flex-direction:column;gap:1px;padding:9px 14px;border-right:1px solid var(--line-2)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1.1;letter-spacing:-.02em}
.stat .v.late{color:var(--late)}
.stat .v.muted{color:var(--ink-2)}
.stat .k{font-size:10.5px;color:var(--ink-2);line-height:1.4}

.count{font-size:12px;color:var(--ink-2);padding:0 14px 9px}
.count:empty{display:none}
.buildtag{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
  letter-spacing:.02em;padding:10px 14px 14px}

/* ---- タブ ---- */
.tabs{display:flex;gap:0;margin:0;background:#fff;border-bottom:1px solid var(--line)}
.tab{padding:0 15px;height:42px;border:0;border-radius:0;
  background:transparent;font-size:13px;font-weight:400;color:var(--ink-2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;
  box-shadow:inset 0 -2px 0 transparent;
  transition:color .15s,box-shadow .15s}
.tab:hover{color:var(--ink)}
.tab.on{background:transparent;color:var(--ink);font-weight:700;
  box-shadow:inset 0 -2px 0 var(--accent)}
.tab-n{font-family:var(--mono);font-size:11px;font-weight:400;padding:0;
  border-radius:0;background:transparent;color:var(--ink-3)}
.tab.on .tab-n{background:transparent;color:var(--accent);font-weight:500}

/* ---- 用件でしぼる ---- */
.filters{display:flex;gap:6px;overflow-x:auto;margin:0;
  padding:9px 14px;background:var(--paper);border-bottom:1px solid var(--line);
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters:empty{display:none}
/* ★2026-08-23：PCではフィルターを折り返します。
 *   横スクロールにしていましたが、スクロールバーを隠しているため
 *   マウスでは動かせず、右端の分類が見えなくなっていました。
 *   指で払えるスマホ（640px以下）は、これまでどおり横スクロールです。 */
@media (min-width: 641px) {
  .filters{flex-wrap:wrap;overflow-x:visible}
}
.fchip{flex:none;border:var(--bd);background:#fff;border-radius:var(--r-sm);
  padding:0 9px;height:26px;font-size:11px;font-weight:400;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
  transition:background .15s,color .15s,border-color .15s}
.fchip:hover{color:var(--ink);border-color:var(--g3)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.fchip .fn{font-family:var(--mono);font-size:10.5px;font-weight:400;color:var(--ink-3);opacity:1}
.fchip.on .fn{color:#ffffffa8}

/* ---- 一覧 ----
 * 1件を1行として詰めます。左端の色は急ぎの度合いです。 */
#list{background:#fff}
.card{
  position:relative;
  background:var(--card); border:0; border-bottom:1px solid var(--line-2); border-radius:0;
  padding:11px 14px 11px 17px; margin:0; cursor:pointer;
  box-shadow:none; transition:background .14s;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--g3);
}
.card:hover,.card:focus-visible{background:#fafbfc;box-shadow:none;transform:none;outline:none}
.card:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap}
.card-sub{display:flex;align-items:baseline;gap:7px;margin-bottom:3px;flex-wrap:wrap}
/* 用件（なければ物件名）。行のなかで一番目に入るもの */
.hl{flex:1 1 auto;font-size:14px;font-weight:700;letter-spacing:.01em;color:var(--ink);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{
  font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;
  background:var(--g1);color:var(--ink-2);white-space:nowrap;
}
.kind.soudan{background:var(--ink);color:#fff}
.topic{
  font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;
  background:#fff;border:1px solid var(--g2);color:var(--ink-2);white-space:nowrap;
}
.topic.manual{background:#fdf7ea;border-color:#e6d3ad;color:var(--warn)}
/* ★送信前に人の作業が必ず要る案件（crmList.gs の tmplMark）
 *   要添付 … 請求書などの添付。忘れると「添付いたしました」が嘘になります
 *   要編集 … 該当しない会社を消す。忘れると2社ぶんの案内が並びます */
.topic.attach{background:#fdecec;border-color:#e8b4b4;color:var(--late)}
.topic.edit{background:#eef3fb;border-color:#b9cbe6;color:#3a63a8}
.bldg{font-weight:400;font-size:11px;color:var(--ink-2);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.snip{
  font-size:12px;color:var(--ink-2);margin:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.55;
}

/* 経過日数：等幅なので桁が揃います */
.days{font-family:var(--mono);font-size:11.5px;font-weight:500;padding:0;
  margin-left:auto;border-radius:0;white-space:nowrap;background:transparent;color:var(--ink-3)}
.days.fresh{background:transparent;color:var(--ink-3)}
.days.warn{background:transparent;color:var(--warn)}
.days.late{background:transparent;color:var(--late)}
.days.making{background:transparent;color:var(--ink-3);border:0;font-family:inherit;font-size:11px}

.card.late::before{background:var(--late)}
.card.warn::before{background:var(--warn-bar)}
.card.making{opacity:1;background:#f9fafb}
.card.making::before{background:var(--g2)}
.card.making .hl{color:var(--ink-3)}
.card.making .snip{font-style:normal;color:var(--ink-3)}
.card.done{background:#fff;box-shadow:none;opacity:1}
.card.done::before{background:var(--g2)}
.card.done .hl{color:var(--ink-2);font-weight:400}
.sent{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;
  background:transparent;padding:0;border-radius:0;margin-left:auto}

/* ---- 詳細 ---- */
.sec{margin-bottom:18px}
.sec>h2{
  font-size:10.5px;font-weight:700;color:var(--ink-2);
  margin:0 0 7px;letter-spacing:.1em;
}
.box{
  background:var(--card);border:var(--bd);border-radius:var(--r);padding:12px 13px;
  white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.8;
  box-shadow:none;
}
.box.quiet{background:#fbfbfc;color:var(--ink-2);font-size:13px}
.meta{font-size:11px;color:var(--ink-2);margin:0 0 2px}
.meta b{color:var(--ink);font-weight:700;font-size:12px}
/* 受信日時が途中で折り返すと読めないので、ひとかたまりにします */
.meta .nw{white-space:nowrap}
/* 件名がこの画面の見出しです */
#dSubject{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.55;margin:5px 0 0}

textarea{
  width:100%;min-height:250px;padding:13px 14px;
  background:#fbfbfc;border:var(--bd);border-radius:var(--r);
  font-size:16px;line-height:1.9;color:var(--ink);font-weight:400;resize:vertical;
  box-shadow:none;transition:border-color .16s,background .16s;
}
textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:none}
textarea.order{min-height:70px;font-size:16px;line-height:1.7}

/* ---- ボタン ---- */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;
  padding-top:13px;border-top:1px solid var(--line)}
button.act{
  font-size:13px;font-weight:400;padding:0 15px;height:44px;border-radius:var(--r-sm);
  border:var(--bd);background:#fff;color:var(--ink-2);cursor:pointer;box-shadow:none;
  transition:border-color .16s,color .16s,background .16s;
}
button.act:hover{border-color:var(--g3);color:var(--ink);box-shadow:none;transform:none}
button.act:active{transform:none}
button.act:disabled{opacity:.4;cursor:default;box-shadow:none;transform:none}
button.send{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;
  font-size:14px;flex:1;min-width:150px}
button.send:hover{background:#000;border-color:#000;color:#fff}
button.send.armed{background:#fff;color:var(--late);border:1px dashed var(--late)}
button.skip{background:#fff;border-color:var(--g2);color:var(--ink-2)}
/* ★送信して返事待ち。完了と見分けが付くよう、白抜きにしています */
button.send.wait{background:#fff;border-color:var(--ink);color:var(--ink)}
button.send.wait:hover{background:var(--g1);border-color:#000;color:#000}
/* ★返事待ちの残り日数 */
.days.wleft{color:var(--ink-2)}
.days.wsoon{color:var(--late);font-weight:700}
.act.ai{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.act.ai:hover{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.order-acts{display:flex;align-items:center;gap:11px;margin-top:9px;flex-wrap:wrap}
.order-note{font-size:11.5px;color:var(--ink-2)}

/* ---- 通知 ---- */
.toast{
  position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;
  padding:10px 18px;border-radius:var(--r);z-index:80;box-shadow:var(--sh-lift);
  max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s;
}
.toast.on{opacity:1}
.toast.bad{background:#fff;color:var(--late);border:1px solid var(--late)}

/* ---- 結果表示 ---- */
.status{
  margin-top:13px;padding:11px 13px;border-radius:var(--r);
  font-size:12.5px;line-height:1.7;border:var(--bd);background:#fff;
  white-space:pre-wrap;word-break:break-word;box-shadow:none;
}
.status .stamp{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px}
.status.ok{background:#f2f6f3;color:#2f5d43;border-color:#c8ddd0}
.status.ok .stamp{color:#6d9481}
.status.bad{background:#fdf3f2;border-color:#e6c2be;color:var(--late)}
.status.work{background:var(--g1);color:var(--ink-2)}

.empty{text-align:center;color:var(--ink-2);padding:46px 20px;font-size:12.5px;background:#fff}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- 添付ファイル ---- */
.att-note{font-weight:400;font-size:10.5px;color:var(--ink-3);margin-left:7px}
.att{display:flex;flex-direction:column;gap:9px}
.att-pick{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  padding:0 12px;height:36px;border:1px dashed var(--g3);border-radius:var(--r-sm);box-shadow:none;
  background:#fff;font-size:12px;font-weight:400;color:var(--accent);cursor:pointer;user-select:none}
.att-pick:hover{box-shadow:none;border-color:var(--accent);background:#fbfbfc}
.att-pick::before{content:"＋";font-size:13px;line-height:1}
.att-pick.busy{opacity:.5;pointer-events:none}
.att-list{display:flex;flex-direction:column;gap:6px}
.att-row{display:flex;align-items:center;gap:9px;padding:0 11px;height:36px;
  border:var(--bd);border-radius:var(--r-sm);background:#fbfbfc;font-size:11.5px}
.att-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.att-row .sz{font-family:var(--mono);color:var(--ink-3);font-size:10.5px;flex:none}
.att-row .rm{flex:none;border:none;background:transparent;color:var(--ink-2);
  font-size:11.5px;cursor:pointer;padding:2px 4px;text-decoration:underline}
.att-row .rm:hover{color:var(--late)}
.att-empty{color:var(--ink-3);font-size:11.5px}

/* ---- 原文 ---- */
.rawbox{margin-top:8px}
.rawbox>summary{cursor:pointer;font-size:12px;color:var(--accent);padding:5px 2px;list-style:none}
.rawbox>summary::-webkit-details-marker{display:none}
.rawbox>summary::before{content:"▸ ";color:var(--g3)}
.rawbox[open]>summary::before{content:"▾ "}
.box.raw{max-height:340px;overflow-y:auto;font-size:11.5px;line-height:1.7;
  white-space:pre-wrap;margin-top:6px}

/* ---- やりとりの履歴 ---- */
.th-note{font-weight:400;font-size:10.5px;color:var(--ink-3);margin-left:7px}
.thread{display:flex;flex-direction:column;gap:9px;max-height:420px;overflow-y:auto;
  padding:12px 13px;border:var(--bd);border-radius:var(--r);background:#fbfbfc}
.thread.empty-wrap{padding:12px 13px;background:#fff}
.th-row{display:flex;flex-direction:column;max-width:100%;width:100%}
.th-row.in{align-self:stretch;align-items:stretch}
.th-row.out,.th-row.draft{align-self:stretch;align-items:stretch}
.th-who{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin:0 0 3px}
.th-bub{padding:0 0 0 10px;border-radius:0;font-size:12.5px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word;background:transparent;border:0;
  border-left:2px solid var(--g2)}
.th-row.in .th-bub{border-radius:0;color:var(--ink-2)}
.th-row.out .th-bub{background:transparent;color:var(--ink);border-color:var(--accent);
  border-radius:0}
.th-row.out .th-who{color:var(--accent)}
.th-row.draft .th-bub{background:transparent;color:var(--ink);
  border-left:2px dashed var(--accent);border-radius:0}
.th-row.cur .th-bub{box-shadow:none;background:#fff}
.th-more{border:none;background:transparent;color:var(--accent);font-size:11px;
  cursor:pointer;padding:2px 4px;align-self:flex-start;margin-top:2px;text-decoration:underline}
.th-empty{color:var(--ink-3);font-size:11.5px}

/* ---- 送信前プレビュー ---- */
.prev summary{font-size:12px;font-weight:400;cursor:pointer;color:var(--accent);
  padding:9px 12px;border:var(--bd);border-radius:var(--r);background:#fff;list-style:none}
.prev summary::-webkit-details-marker{display:none}
.prev summary::before{content:"▸ ";color:var(--g3)}
.prev[open] summary::before{content:"▾ "}
.prev[open] summary{margin-bottom:8px}

/* ---- 営業タブ ---- */
.card.eigyou{background:#fff;box-shadow:none;cursor:default;padding-bottom:13px}
.card.eigyou::before{background:var(--g2)}
.card.eigyou .bldg{color:var(--ink);font-weight:700;font-size:13px}
.flag{font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;
  background:var(--ink);color:#fff;white-space:nowrap}
.flag.doubt{background:#fdf7ea;color:var(--warn);border:1px solid #e6d3ad}
.reason{font-size:10.5px;color:var(--ink-3);margin:6px 0 0;line-height:1.6}
.unbtn{margin-top:9px;padding:0 12px;height:32px;border:var(--bd);
  border-radius:var(--r-sm);background:#fff;font-size:11.5px;font-weight:400;
  color:var(--accent);cursor:pointer}
.unbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.eigyou-note{font-size:11.5px;color:var(--ink-2);line-height:1.7;
  padding:11px 13px;border-bottom:1px solid var(--line);
  background:#fbfbfc;margin-bottom:0}

/* ============================================================
 *  広い画面では、そのまま横に伸ばします
 * ============================================================ */
@media (min-width: 780px) {
  /* 画面が広いときは、一覧を紙のように1枚に見せます */
  .wrap{background:#fff;min-height:100vh;
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
  /* 数字は左に寄せます。横いっぱいに引き伸ばすと、かえって読みにくいためです */
  .stats{grid-template-columns:repeat(3,minmax(0,150px))}
  .stat:last-child{border-right:1px solid var(--line-2)}
}
@media (min-width: 1000px) {
  .wrap{max-width:1040px}
  #listView{width:auto}
}

/* ============================================================
 *  1件を開くと、まん中に大きく出します
 * ============================================================ */
#detailView{
  position:fixed;inset:0;z-index:55;overflow-y:auto;
  padding:26px 20px 40px;
  background:rgba(22,24,29,.34);
  -webkit-backdrop-filter:blur(7px);
  backdrop-filter:blur(7px);
  animation:veilIn .16s ease-out;
}
#detailView.hide{display:none}
.dcard{
  max-width:880px;margin:0 auto;background:#fff;border-radius:8px;
  padding:20px 22px 24px;box-shadow:0 20px 50px rgba(22,24,29,.26);
  animation:zenIn .2s ease-out;
}
@media (max-width:640px){
  #detailView{padding:0;background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
  .dcard{border-radius:0;box-shadow:none;padding:14px 14px 28px;min-height:100%}
}
/* 閉じるボタンは、開いている間ずっと右上に置いておきます */
.back{
  position:sticky;top:0;float:right;margin:0 0 4px 12px;z-index:2;
  background:#fff;border:var(--bd);border-radius:var(--r-sm);padding:0 13px;height:34px;
  color:var(--ink-2);font-size:12px;font-weight:400;cursor:pointer;box-shadow:none;
}
.back:hover{background:var(--g1);color:var(--ink);border-color:var(--g3)}

/* ============================================================
 *  集中編集
 * ============================================================ */
.veil{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(22,24,29,.34);
  -webkit-backdrop-filter:blur(7px);
  backdrop-filter:blur(7px);
  padding:22px;top:0;left:0;right:0;height:100%;
}
.veil[data-open="true"]{display:grid;place-items:center;animation:veilIn .16s ease-out}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
.zen{width:min(960px,96vw);max-height:94vh;display:flex;flex-direction:column;
  background:#fff;border-radius:8px;overflow:hidden;
  box-shadow:0 20px 50px rgba(22,24,29,.3);animation:zenIn .2s ease-out}
@keyframes zenIn{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
.zen-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  padding:12px 16px;background:var(--ink);color:#fff}
.zen-head h3{margin:0;font-size:15px;font-weight:700}

  margin-left:auto;height:34px;padding:0 16px;border-radius:980px;
  border:1px solid #e4c691;background:#fff;color:var(--warn);
  font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
}
.hidden-bar button:hover{background:var(--warn);border-color:var(--warn);color:#fff;}
@media (max-width:640px){
  .hidden-bar{margin:0 12px 10px;padding:12px 14px;font-size:13px;}
  .hidden-bar button{margin-left:0;width:100%;}
}

/* ---- 書く画面：中の高さを取りこぼさないようにする ----
 * ★textarea に height:100% を掛けていましたが、親の高さが
 *   flex で決まる形だと 100% が効かず、文章ぶんの高さ（数行）に
 *   縮んでいました。余白があるのに縦スクロールが出ていた原因です。
 *   親を基準にして、textarea を四辺に貼り付けます。 */
.zen{
  width:min(1120px,96vw);
  height:min(94vh,1040px);
  max-height:94vh;
}
/* 問い合わせの控えは場所を取りすぎないように。中だけで送れます */
.zen-ask{max-height:13vh;overflow:auto;}
.zen.ask-open .zen-ask{max-height:44vh;}
.zen-edit{
  flex:1 1 auto;min-height:0;display:block;position:relative;
}
.zen-edit textarea{
  position:absolute;inset:0;width:100%;height:100%;
  box-sizing:border-box;resize:none;border:0;border-radius:0;
  background:#fff;font-size:17px;line-height:1.95;padding:24px 26px;
}
@media (max-width:640px){
  .zen{width:100vw;height:100vh;max-height:100vh;}
  .zen-ask{max-height:15vh;}
  .zen-edit textarea{font-size:16px;padding:18px 18px;}
}

/* ---- 「いま ここ」は薄い緑に ----
 * 返信案（青）と同じ色だと、どちらがどちらか分かりませんでした。
 * いる場所＝緑、書く中身＝青、と色で役割を分けます。 */
.tl-item.now .tl-dot{
  background:var(--ok);color:#fff;
  box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--ok-soft);
}
.tl-item.now .tl-card{
  background:var(--ok-soft);border:1px solid var(--ok-line);box-shadow:none;
}
.tl-item.now .tl-who{color:var(--ok);}
.tl-item.now .tl-at{color:var(--ok);opacity:.75;}
.tl-item.now .tl-text{color:#123f2a;}
.tl-go{color:var(--ok);}
button.tl-card.go:hover{background:#dcf0e5;}
button.tl-card.go:active{background:#cfe9da;}
button.tl-card.go:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(26,127,75,.25);}
/* 外した欄の名残り */
.draft-open{display:none!important;}

/* ---- 書く画面の上下に出す、宛名と署名 ----
 * ここはクラウドが送信の直前に付ける部分なので、直せません。
 * 直せないことが分かるよう、面を落として文字も控えめにします。 */
.zen-band{
  flex:none;background:var(--g1);color:var(--ink-2);
  padding:11px 26px;font-size:13.5px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;
  /* 本文の場所を食わないよう、3行ぶんまで。続きは中でスクロールします */
  max-height:5.6em;overflow:auto;
  display:flex;flex-direction:column;gap:3px;
}
.zen-band.hide{display:none;}
#zenTo{border-bottom:1px solid var(--line-2);}
#zenSign{border-top:1px solid var(--line-2);}
.zen-band .zb-cap{
  font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:0;
}
.zen-band .zb-t{color:var(--ink-2);}
@media (max-width:640px){
  .zen-band{padding:9px 18px;font-size:12.5px;max-height:4.6em;}
}

/* ---- 「いま ここ」は返信案の段そのものに付けます ----
 * 緑の段は取りやめました。手を入れる場所と印が離れて見えたためです。 */
.tl-item.now .tl-dot{
  background:var(--accent);color:#fff;
  box-shadow:0 0 0 4px var(--card),0 0 0 7px var(--accent-soft);
}
.tl-item.now .tl-card{
  background:#f1f7ff;border:1px solid #bcdcfa;box-shadow:inset 3px 0 0 var(--accent);
}
.tl-item.now .tl-who{color:var(--ink-2);}
.tl-item.now .tl-at{color:var(--accent);opacity:.8;font-weight:600;}
.tl-item.now .tl-text{color:var(--ink);}
/* 「いま ここ」の札 */
.tl-pill{
  display:inline-flex;align-items:center;height:21px;padding:0 9px;border-radius:980px;
  background:var(--accent);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:0;
}
/* 次にやること */
.tl-next{
  margin-top:8px;padding-top:8px;border-top:1px solid #cfe2f8;
  font-size:13px;line-height:1.7;color:var(--ink-2);
}
.tl-go{color:var(--accent);}
button.tl-card.go:hover{background:#e6f1fe;}
button.tl-card.go:active{background:#dbeafd;}
button.tl-card.go:focus-visible{outline:none;box-shadow:inset 3px 0 0 var(--accent),0 0 0 4px rgba(0,113,227,.22);}
/* 長い返信案でも、行が伸びすぎないように */
.tl-item.now .tl-text{max-height:46vh;overflow:auto;}

/* ---- 完了：片づいたものとして、グレーアウトさせます ----
 * ★一度みどりにしましたが、ご指摘のとおり読み違えでした。
 *   完了は「もう見なくてよいもの」なので、色で目を引くのではなく
 *   落ち着いた灰色にして、赤（急ぎ）から目線を奪わないようにします。
 *   枠の形だけは3日以上の赤とそろえています。 */
.card.done{
  /* ★#f4f4f6 は白に近すぎて「白いまま」に見えていました。もう一段落とします */
  background:#e8e8ed;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.14);
  border-bottom-color:rgba(0,0,0,.10);
}
.card.done:hover,.card.done:focus-visible{background:#e0e0e6;}
.card.done:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);}
.card.done::before{display:none;}
.card.done .cico .ic{background:#d6d6dc;color:#7c7c82;}
.card.done .cico .ct{color:#7c7c82;}
.card.done .hl{color:#6e6e73;font-weight:600;}
.card.done .hl .room{color:#8b8b90;}
.card.done .nm{color:#6e6e73;}
.card.done .snip{color:#6e6e73;}
.card.done .sent{color:#6e6e73;font-weight:600;}
.card.done .time{color:#8b8b90;}
.card.done .kind{background:#d6d6dc;color:#6e6e73;}

/* 上の「完了」の枠も、同じく灰色にそろえます */
#btnDone .v, #btnDone.on .v{color:#86868b;}
#btnDone .k{color:#86868b;opacity:1;}
#btnDone.on{background:rgba(0,0,0,.09);}
#btnDone:hover{background:rgba(0,0,0,.04);}

/* ══════════════════════════════════════════════════════════════
   仕上げ：面と線を減らし、文字で読ませる
   ────────────────────────────────────────────────────────────
   ★灰色の角丸タイルに絵を載せる形は、画面のあちこちに四角が並んで
     しまい、古い管理画面のように見えていました。タイルをやめて絵だけ
     置き、色は「急ぎ＝赤」「片づいた＝灰」の2つに絞ります。
     この <style> ごと消せば前に戻ります。
   ══════════════════════════════════════════════════════════════ */

/* ---- 用件のならび：下地の四角をやめる ---- */
.ficon .ic{background:transparent;width:auto;height:auto;border-radius:0;}
.ficon{width:118px;padding:12px 6px 14px;gap:7px;border-radius:16px;}
.ficon svg{width:32px;height:32px;color:var(--ink-2);}
.ficon:hover{background:rgba(0,0,0,.035);}
.ficon:hover .ic{background:transparent;}
.ficon .fl{font-size:13px;font-weight:400;color:var(--ink-2);min-height:2.5em;}
.ficon .fn{font-size:21px;font-weight:600;letter-spacing:-.03em;color:var(--ink);}
.ficon .fr{font-size:11.5px;color:var(--ink-3);}
/* 選んでいるものは、面ではなく色と太さで示します */
.ficon.on{background:transparent;}
.ficon.on .ic{background:transparent;box-shadow:none;}
.ficon.on svg{color:var(--accent);}
.ficon.on .fl{color:var(--accent);font-weight:600;}
.ficon.on .fn{color:var(--accent);}

/* ---- 一覧 ---- */
#list{box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 34px rgba(0,0,0,.05);}
.card{padding:19px 24px 19px 24px;}
.card::before{display:none;}
.crow{gap:18px;}
.cico{width:74px;gap:7px;padding-top:3px;}
.cico .ic{background:transparent;width:auto;height:auto;border-radius:0;}
.cico svg{width:29px;height:29px;color:var(--ink-2);}
.cico .ct{font-size:11.5px;font-weight:500;color:var(--ink-3);letter-spacing:0;}

.card .hl{font-size:17px;font-weight:600;letter-spacing:-.021em;color:var(--ink);}
.card .hl .room{color:var(--ink-2);font-weight:500;margin-left:7px;font-size:15px;}
.card .nm{font-size:13.5px;font-weight:500;color:var(--ink-2);}
.card-sub{gap:10px;}
.card .kind{
  background:transparent;border:1px solid var(--line);color:var(--ink-3);
  font-weight:400;font-size:11px;padding:1px 8px;
}
.card .kind.soudan{background:transparent;border-color:var(--g3);color:var(--ink-2);}
.card .time{font-size:12px;color:var(--ink-3);}
.card .snip{font-size:14px;line-height:1.7;color:var(--ink-2);margin-top:6px;}
.card .days{font-size:12.5px;font-weight:500;color:var(--ink-3);letter-spacing:0;}

/* 急ぎ＝赤。枠は細く、面はごく淡く。強いのは文字と絵の色です */
.card.late{
  background:#fff8f7;
  box-shadow:inset 3px 0 0 var(--late),inset 0 0 0 1px rgba(215,0,21,.16);
}
.card.late:hover,.card.late:focus-visible{background:#fff2f0;}
.card.late .cico svg{color:var(--late);}
.card.late .cico .ct{color:var(--late);}
.card.late .hl{color:var(--ink);}
.card.late .hl .room{color:var(--ink-2);}
.card.late .snip{color:var(--ink-2);}
.card.late .time{color:#a1737a;}
.card.late .days{color:var(--late);font-weight:600;}

/* 片づいた＝灰。読まなくてよいので、いちばん静かにします */
.card.done{
  background:#ececed;
  box-shadow:inset 3px 0 0 rgba(0,0,0,.20),inset 0 0 0 1px rgba(0,0,0,.07);
}
.card.done:hover,.card.done:focus-visible{background:#e5e5e7;}
.card.done .cico svg{color:#8b8b90;}
.card.done .hl{color:#6e6e73;}
.card.done .hl .room{color:#8b8b90;}
.card.done .kind{border-color:#cfcfd4;color:#8b8b90;background:transparent;}

/* ---- 上の件数 ---- */
.stat .v{font-size:32px;font-weight:600;letter-spacing:-.035em;}
.stat .k{font-size:12px;color:var(--ink-3);}
#btnDone.on{background:rgba(0,0,0,.055);}

@media (max-width:640px){
  .ficon{width:104px;}
  .ficon svg{width:29px;height:29px;}
  .cico{width:62px;}
  .cico svg{width:26px;height:26px;}
  .card{padding:16px 15px;}
  .crow{gap:13px;}
}

/* ---- 用件のならびは一覧に出しません（分析には残しています） ---- */
#filters,.fscroll{display:none!important;}

/* ---- 上のタブを大きく ---- */
.tabs{padding:18px 22px 10px;gap:10px;}
.tab{height:50px;padding:0 24px;font-size:18px;font-weight:500;letter-spacing:-.02em;}
.tab.on{font-weight:600;}
.tab-n{font-size:15px;margin-left:8px;}

/* 見出し */
h1{letter-spacing:-.03em;}

@media (max-width:640px){
  .tabs{padding:14px 12px 8px;gap:6px;}
  .tab{height:44px;padding:0 18px;font-size:16px;}
  .tab-n{font-size:13.5px;margin-left:6px;}
}

/* ══════════════════════════════════════════════════════════════
   一覧を、横並びの正方形カードにする
   ────────────────────────────────────────────────────────────
   1件＝1行の横長だと、広い画面では右側がまるごと余っていました。
   幅に応じて2列・3列・4列と自動で並べ、1枚を正方形にします。
   （狭い画面では1列にし、正方形はやめて中身ぶんの高さにします）
   ══════════════════════════════════════════════════════════════ */
#list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:16px;
  background:transparent;box-shadow:none;overflow:visible;border-radius:0;
}
#list > .empty,#list > .eigyou-note{grid-column:1 / -1;}
/* 分析タブは、カードを並べずに1枚ずつ横いっぱいで見せます */
#list > .an-hero,#list > .an-card{grid-column:1 / -1;margin-left:0;margin-right:0;}

.card{
  aspect-ratio:1 / 1;
  display:flex;flex-direction:column;
  background:var(--card);border:0;border-bottom:0;
  border-radius:18px;padding:22px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 26px rgba(0,0,0,.05);
  overflow:hidden;
}
.card:hover,.card:focus-visible{
  background:var(--card);
  box-shadow:0 2px 6px rgba(0,0,0,.07),0 14px 40px rgba(0,0,0,.09);
  transform:translateY(-1px);
}
.card:focus-visible{box-shadow:0 0 0 3px var(--accent);}
.card.on{box-shadow:0 0 0 2px var(--accent),0 10px 30px rgba(0,113,227,.16);}

/* 中身を、上から下へ流します */
.crow{flex:1;min-height:0;gap:16px;}
.cbody{display:flex;flex-direction:column;min-height:0;}
.card .snip{
  flex:1;min-height:0;-webkit-line-clamp:6;margin-top:8px;
}
.card-top{flex-wrap:wrap;}

/* 急ぎ＝赤 */
.card.late{
  background:#fff8f7;
  box-shadow:inset 4px 0 0 var(--late),0 1px 2px rgba(215,0,21,.08),
             0 8px 26px rgba(215,0,21,.10);
}
.card.late:hover,.card.late:focus-visible{
  background:#fff2f0;
  box-shadow:inset 4px 0 0 var(--late),0 2px 8px rgba(215,0,21,.12),
             0 16px 42px rgba(215,0,21,.16);
}
/* 片づいた＝灰 */
.card.done{
  background:#ececed;
  box-shadow:inset 4px 0 0 rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.05);
}
.card.done:hover,.card.done:focus-visible{
  background:#e5e5e7;
  box-shadow:inset 4px 0 0 rgba(0,0,0,.22),0 10px 30px rgba(0,0,0,.09);
}

/* 営業の行は文章が長いので、正方形にはしません */
.card.eigyou{aspect-ratio:auto;padding:20px;}
.card.eigyou .snip{-webkit-line-clamp:4;}

@media (max-width:900px){
  #list{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px;}
}
@media (max-width:640px){
  /* 1列のときに正方形にすると、間延びして送りが増えるだけなので
     中身ぶんの高さに戻します */
  #list{grid-template-columns:1fr;gap:11px;margin:0 12px;}
  .card{aspect-ratio:auto;padding:16px;border-radius:16px;}
  .card .snip{-webkit-line-clamp:3;}
}

/* ---- 正方形カードの中身の組み方 ----
 * 絵を左の柱にしたままだと、右下がまるごと空いて間延びしていました。
 * 上から「用件の絵 → 物件名 → お名前と日時 → 本文」と流し、
 * 経過日数だけを右下に置いて、四隅が締まるようにします。 */
.crow{flex-direction:column;gap:13px;}
.cico{
  flex-direction:row;align-items:center;gap:9px;width:auto;padding-top:0;
}
.cico svg{width:26px;height:26px;}
.cico .ct{
  font-size:12.5px;font-weight:600;text-align:left;letter-spacing:-.01em;
  color:var(--ink-2);
}
.card.late .cico .ct{color:var(--late);}

.cbody{flex:1;min-height:0;padding-bottom:22px;}
.card .hl{font-size:18px;line-height:1.35;white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card .hl .room{margin-left:6px;}
.card-sub{margin-top:5px;}
.card .snip{-webkit-line-clamp:5;margin-top:9px;}

/* 経過日数・送信済みは右下へ */
.card .days,.card .sent{
  position:absolute;right:22px;bottom:18px;margin-left:0;
}
.card.eigyou .days,.card.eigyou .sent{position:static;margin-left:auto;}

@media (max-width:640px){
  .cbody{padding-bottom:0;}
  .card .days,.card .sent{position:static;margin-left:auto;}
  .card .hl{-webkit-line-clamp:2;font-size:16px;}
}

/* ---- 気づいたこと ---- */
.an-tips{display:flex;flex-direction:column;gap:12px;}
.an-tip{
  padding:15px 18px 15px 20px;border-radius:14px;
  background:#fbfbfd;border:1px solid var(--line-2);
  box-shadow:inset 3px 0 0 var(--g3);
}
.an-tip.hi{background:#fff8f7;border-color:rgba(215,0,21,.18);box-shadow:inset 3px 0 0 var(--late);}
.an-tip.mid{background:#fffaf1;border-color:#f0ddb9;box-shadow:inset 3px 0 0 var(--warn-bar);}
.an-tip.low{background:#f7faff;border-color:#d7e6f8;box-shadow:inset 3px 0 0 var(--accent);}
.an-tip-t{
  margin:0 0 5px;font-size:15px;font-weight:600;line-height:1.55;
  letter-spacing:-.012em;color:var(--ink);
}
.an-tip.hi .an-tip-t{color:#8c0512;}
.an-tip-d{margin:0;font-size:13.5px;line-height:1.8;color:var(--ink-2);}
@media (max-width:640px){
  .an-tip{padding:13px 14px 13px 16px;}
  .an-tip-t{font-size:14px;}
  .an-tip-d{font-size:13px;}
}

/* ---- 並べ方の切り替えボタン ---- */
.viewtog{
  margin-left:auto;flex:none;height:38px;padding:0 16px;border-radius:980px;
  border:1px solid var(--line);background:#fff;color:var(--ink-2);
  font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
  white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
}
.viewtog:hover{background:var(--g1);border-color:var(--g3);color:var(--ink);}

/* ══ 一覧のかたち（1件＝1行） ══════════════════════════════════════ */
body.view-rows #list{
  grid-template-columns:1fr;gap:0;
  background:var(--card);border-radius:var(--r-panel);
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 10px 34px rgba(0,0,0,.05);
  overflow:hidden;
}
body.view-rows .card{
  aspect-ratio:auto;border-radius:0;padding:18px 22px;
  box-shadow:none;border-bottom:1px solid var(--line-2);
}
body.view-rows .card:last-child{border-bottom:0;}
body.view-rows .card:hover,body.view-rows .card:focus-visible{
  transform:none;box-shadow:none;background:#fafafc;
}
body.view-rows .crow{flex-direction:row;gap:18px;}
body.view-rows .cico{flex-direction:column;width:74px;gap:7px;padding-top:2px;}
body.view-rows .cico .ct{text-align:center;}
body.view-rows .cbody{padding-bottom:0;}
body.view-rows .card .hl{font-size:17px;-webkit-line-clamp:1;}
body.view-rows .card .snip{-webkit-line-clamp:2;flex:0 1 auto;}
body.view-rows .card .days,body.view-rows .card .sent{
  position:static;margin-left:auto;
}
body.view-rows .card.late{
  background:#fff8f7;box-shadow:inset 4px 0 0 var(--late);
}
body.view-rows .card.late:hover{background:#fff2f0;box-shadow:inset 4px 0 0 var(--late);}
body.view-rows .card.done,body.view-rows .card.eigyou{
  background:#ececed;box-shadow:inset 4px 0 0 rgba(0,0,0,.22);
}
body.view-rows .card.done:hover,body.view-rows .card.eigyou:hover{
  background:#e5e5e7;box-shadow:inset 4px 0 0 rgba(0,0,0,.22);
}
body.view-rows .card.eigyou{aspect-ratio:auto;}

/* ══ 営業も「対応しないもの」なので、完了と同じ灰色にします ══════════ */
.card.eigyou{
  background:#ececed;
  box-shadow:inset 4px 0 0 rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.05);
}
.card.eigyou:hover,.card.eigyou:focus-visible{
  background:#e5e5e7;
  box-shadow:inset 4px 0 0 rgba(0,0,0,.22),0 10px 30px rgba(0,0,0,.09);
}
.card.eigyou .cico svg{color:#8b8b90;}
.card.eigyou .cico .ct{color:#8b8b90;}
.card.eigyou .bldg{color:#57575c;}
.card.eigyou .snip{color:#6e6e73;}
.card.eigyou .time,.card.eigyou .reason{color:#8b8b90;}
.card.eigyou .flag{background:#d6d6dc;color:#57575c;border-color:#c9c9d0;}

/* ══ 文字が切れていた件 ═══════════════════════════════════════════
   ★件名に「1行で省略」を掛けていたため、幅の狭いカードでは

<body>
<div class="wrap">

<script>
const API = "https://script.google.com/macros/s/AKfycbws85BB01CV2U4yJO6z3gHnH5ZjQp0rPviQ_XTpGR2c5p5uxJUKCwxz_M47y3TViLD1/exec";

/* ---------- APIを呼ぶ（JSONP） ---------- */
let jsonpSeq = 0;
function api(params) {
  return new Promise(function (resolve, reject) {
    const cb = "__crm_cb_" + (++jsonpSeq) + "_" + Date.now();
    const s  = document.createElement("script");
    let done = false;

    const timer = setTimeout(function () {
      if (done) return;
      cleanup();
      reject(new Error("応答がありません。通信状況を確認してください"));
    }, 25000);

    function cleanup() {
      done = true;
      clearTimeout(timer);
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
    }

    window[cb] = function (data) { cleanup(); resolve(data); };

    const q = Object.keys(params)
      .map(function (k) { return k + "=" + encodeURIComponent(params[k]); })
      .join("&");

    s.src = API + "?" + q + "&callback=" + cb;
    s.onerror = function () { if (!done) { cleanup(); reject(new Error("接続できません")); } };
    document.head.appendChild(s);
  });
}

/* ---------- 画面の部品 ---------- */
const UI_BUILD = "ui-2026-08-23w";
const $ = function (id) { return document.getElementById(id); };
let cur  = null;
let isTest = true;

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast on" + (bad ? " bad" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.className = "toast"; }, 3200);
}

/* 結果を画面に残す。トーストと違い、自動では消えません */
function setStatus(kind, msg) {
  const el = $("status");
  if (!kind) { el.className = "status hide"; el.textContent = ""; return; }
  const d = new Date();
  const hh = ("0" + d.getHours()).slice(-2), mm = ("0" + d.getMinutes()).slice(-2),
        ss = ("0" + d.getSeconds()).slice(-2);
  el.className = "status " + kind;
  el.textContent = msg;
  const t = document.createElement("span");
  t.className = "stamp";
  t.textContent = hh + ":" + mm + ":" + ss;
  el.appendChild(t);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- 一覧 ---------- */
let listOpen = [];
let listWait = [];
let listDone = [];
let listTab  = "open";

/* ★返事待ちの残り日数
 *
 *   waitLeft は crmList.gs が入れます。
 *     2 … あと2日　0 … 今日が期限　null … 返事待ちではない
 *   期限を過ぎた行は完了タブへ回るので、ここに負の数は来ません。 */
function waitLabel(d) {
  if (d === null || d === undefined) return "";
  if (d === 0) return "本日期限";
  return "あと" + d + "日";
}
/* ★何日で赤にするか。ここ1か所だけ直せば、行の色・上の件数・
 *   しぼり込み・下の文章のすべてが同じ日数で動きます */
const LATE_DAYS = 3;

function waitClass(d) {
  if (d === null || d === undefined) return "wleft";
  return (d <= 4) ? "wsoon" : "wleft";
}

function daysLabel(d) {
  if (d === null || d === undefined) return "";
  if (d === 0) return "本日";
  return d + "日経過";
}
function daysClass(d) {
  if (d === null || d === undefined) return "fresh";
  if (d >= LATE_DAYS) return "late";   /* 赤：3日以上ほったらかし */
  if (d >= 2) return "warn";           /* 黄：2日 */
  return "fresh";
}


/* ============================================================
 *  用件を一言にする
 *
 *  一覧に並ぶのは返信案の書き出しですが、それだと
 *  「お問い合わせいただきありがとうございます」ばかりが並び、
 *  何の件なのかが分かりません。返信案から用件を拾って、
 *  「名義変更」「保管場所使用承諾書」のように短く出します。
 *
 *  ★上から順に見て、最初に当たったものを使います。
 *    駐車場より先に保管場所を見るなど、順番に意味があります。
 * ============================================================ */
const TOPICS = [
  ["保管場所使用承諾書", ["保管場所", "車庫証明", "使用承諾", "車庫の証明"]],
  ["名義変更",           ["名義変更", "名義の変更", "契約者変更", "契約者の変更", "契約者様の変更"]],
  ["車両変更",           ["車両変更", "車両の変更", "車の変更", "車を変え", "車が変わ", "ナンバー変更", "お車のご変更"]],
  ["無断駐車",           ["無断駐車", "迷惑駐車", "知らない車", "停められて"]],
  ["駐車場",             ["駐車場", "駐車", "もう一台", "もう1台", "空き区画", "区画", "満車"]],
  ["ペット",             ["ペット", "小型犬", "飼育", "飼っても", "飼いたい", "猫"]],
  ["エアコン",           ["エアコン", "冷房", "暖房", "効かない"]],
  ["インターネット",     ["インターネット", "Wi-Fi", "WiFi", "ｗｉ-ｆｉ", "wifi", "回線", "ネット環境"]],
  ["ポスト・宅配BOX",    ["ポスト", "宅配", "暗証番号", "メールボックス", "ダイヤル"]],
  ["ゴミ",               ["ゴミ", "ごみ", "分別"]],
  ["騒音",               ["騒音", "うるさ", "音がする", "足音"]],
  ["領収書",             ["領収書", "領収証"]],
  ["解約・退去",         ["解約", "退去", "引っ越", "引越"]],
  ["修繕",               ["修繕", "不具合", "水漏れ", "故障", "壊れ", "直して", "修理", "詰まり", "雨漏り"]],
  ["鍵",                 ["鍵", "キーボックス", "開錠", "紛失"]],
  ["内見",               ["内見", "内覧", "見学", "案内", "見に行"]],
  ["空室確認",           ["空室", "空いて", "募集", "満室"]],
  ["更新",               ["更新料", "契約更新", "更新の"]],
  ["火災保険",           ["火災保険", "保険"]],
  ["口座変更",           ["口座", "引落", "引き落と", "通帳", "振込先"]],
];

/* ★営業メールの見分け方
 *   自動の振り分けをすり抜けて、通常の一覧に混ざって届くものがあります。
 *   返信せずに完了へ送るものなので、ひと目で分かるようにします。
 *   入居者様が書かない言い回しだけを並べ、2つ以上そろったら営業とします。
 *   1つでも決まりのものは EIGYOU_SURE に分けています。 */
const EIGYOU_SURE = [
  "配信停止", "営業のご連絡", "無料トライアル", "ご担当者各位",
  "一斉送信", "営業メール",
];
const EIGYOU_MARK = [
  "ご担当者様", "ご担当者さま", "担当者様", "ご担当の方",
  "突然のご連絡", "初めてご連絡", "はじめてご連絡", "突然のメール",
  "お役に立て", "お役に立つ", "お力になれ",
  "ご提案", "ご案内させて", "ご紹介させて", "ご紹介いたします",
  "弊社について", "弊社は", "当社は", "私どもは", "私共は",
  "商談", "お打ち合わせの機会", "打ち合わせの機会", "面談の機会",
  "資料をお送り", "資料をご送付", "資料請求",
  "無料で", "お試し", "キャンペーン",
  "掲載のご案内", "コスト削減", "集客", "売上", "実績多数",
  "創業", "施工業者", "代理店",
];

function isEigyouText(t) {
  for (let i = 0; i < EIGYOU_SURE.length; i++) {
    if (t.indexOf(EIGYOU_SURE[i]) >= 0) return true;
  }
  let n = 0;
  for (let i = 0; i < EIGYOU_MARK.length; i++) {
    if (t.indexOf(EIGYOU_MARK[i]) >= 0) n++;
    if (n >= 2) return true;
  }
  return false;
}

function topicOf(text) {
  const t = String(text || "");
  if (!t) return "";
  /* 用件のことばより先に見ます。「保険」「駐車場」などが本文に
     入っていても、営業なら営業として出したいためです */
  if (isEigyouText(t)) return "営業";
  for (let i = 0; i < TOPICS.length; i++) {
    const keys = TOPICS[i][1];
    for (let k = 0; k < keys.length; k++) {
      if (t.indexOf(keys[k]) >= 0) return TOPICS[i][0];
    }
  }
  return "";
}


/* ───────────────────────────────────────────────────────────────
 * 一覧を、目を凝らさなくても読めるようにするための下ごしらえ。
 * 問い合わせ本文はフォームから来るので、頭に決まった形が付きます。
 *   ［個人 / 佐藤咲桜 / 07075674888］
 *   内容：お世話になります。……
 * ここから お名前 と 号室 を取り出し、本文はあいさつと名乗りを外して
 * 用件だけを残します。クラウド側は一切変えていません。画面の中だけで
 * 組み立てているので、表計算の列が増えたり減ったりはしません。
 * ─────────────────────────────────────────────────────────────── */

/* 物件名の末尾に付いている部屋番号を切り離します
 * 例：「カルムコート東棟207」→ 名前「カルムコート東棟」／号室「207」 */
function splitBldg(b) {
  const t = String(b || "").trim();
  if (!t) return { name: "", room: "" };
  const m = t.match(/^(.*?[^0-9\uFF10-\uFF19\s])\s*([0-9\uFF10-\uFF19]{2,4})\s*(?:\u53F7\u5BA4?)?$/);
  if (m) return { name: m[1].trim(), room: m[2] };
  return { name: t, room: "" };
}

/* 物件名に部屋番号が入っていないときは、本文から拾います */
function roomOf(text) {
  const m = String(text || "").match(/([0-9\uFF10-\uFF19]{2,4})\s*\u53F7\u5BA4/);
  return m ? m[1] : "";
}

/* お名前。
 * ★はじめは「◯◯と申します」といった名乗りの文からも拾っていましたが、
 *   「8月分の家賃領収書をメールで送っていただきたいです」を
 *   「で送っていただきたい 様」と読み違えました。
 *   文章から人の名前を当てるのは当てになりません。いまは
 *   はっきり氏名だと分かる書き方だけを見て、無ければ出しません。 */
function nameOf(x) {
  const t = String((x && x.content) || "");
  /* ① ［個人 / 佐藤咲桜 / 07075674888］ の真ん中 */
  let m = t.match(/\uFF3B[^\uFF3D]*?[\/\uFF0F]\s*([^\/\uFF0F\uFF3D]{2,24})\s*[\/\uFF0F]/);
  if (m && !/^[0-9\-\s]+$/.test(m[1])) return m[1].trim();
  /* ② 「氏名：◯◯」「お名前：◯◯」 */
  m = t.match(/(?:\u304A\u540D\u524D|\u6C0F\u540D)\s*[:\uFF1A]\s*([^\n]{2,24})/);
  if (m) return m[1].trim();
  return "";
}

/* あいさつ・名乗り・結びの決まり文句。要約からは外します */
const FILLER = [
  "\u304A\u4E16\u8A71\u306B\u306A\u308A\u307E\u3059",          /* お世話になります */
  "\u304A\u4E16\u8A71\u306B\u306A\u3063\u3066\u304A\u308A\u307E\u3059",  /* お世話になっております */
  "\u306F\u3058\u3081\u307E\u3057\u3066",                        /* はじめまして */
  "\u5931\u793C\u3044\u305F\u3057\u307E\u3059",                 /* 失礼いたします */
  "\u5B9C\u3057\u304F\u304A\u9858\u3044",                        /* 宜しくお願い */
  "\u3088\u308D\u3057\u304F\u304A\u9858\u3044",                 /* よろしくお願い */
  "\u3054\u9023\u7D61\u3042\u308A\u304C\u3068\u3046",          /* ご連絡ありがとう */
  "\u3042\u308A\u304C\u3068\u3046\u3054\u3056\u3044\u307E\u3059" /* ありがとうございます */
];

/* 本文を、用件だけの短い一文にまとめます */
function summarize(text, limit) {
  let t = String(text || "")
    .replace(/\uFF3B[^\uFF3D]*\uFF3D/g, " ")        /* ［個人 / 氏名 / 電話］ */
    .replace(/^[\s\S]*?\u5185\u5BB9[:\uFF1A]/, "") /* 「内容：」より前を落とす */
    .replace(/\r/g, "")
    .replace(/[ \t\u3000]+/g, " ");
  const parts = t.split(/[\u3002\n]+/).map(function (v) { return v.trim(); })
                 .filter(function (v) { return v.length > 0; });
  const body = parts.filter(function (v) {
    if (v.length <= 3) return false;
    for (let i = 0; i < FILLER.length; i++) {
      if (v.indexOf(FILLER[i]) >= 0 && v.length < 34) return false;
    }
    /* 「◯◯に住んでいる△△です」といった名乗りは落とします */
    if (/\u4F4F\u3093\u3067/.test(v) && /\u3067\u3059|\u307E\u3059/.test(v) && v.length < 46) return false;
    return true;
  });
  const use = (body.length ? body : parts).join("\u3002");
  const max = limit || 110;
  return use.length > max ? use.slice(0, max) + "\u2026" : use;
}

function cardHtml(x, done, wait) {
  const soudan = x.kind === "入居者相談" ? " soudan" : "";
  /* 返信案がまだ無い行（未処理）は、作成中と分かるようにします。
   * F列を消して作り直すとき、案件が消えたように見えないためです。 */
  const snip   = x.making
    ? "返信案を作っています…（10分ほどで並びます）"
    : summarize(x.content || x.draft, 110);
  const cls    = (done || wait ? "done" : daysClass(x.days)) + (x.making ? " making" : "");
  const topic  = topicOf(x.content);
  /* ★返事待ちは、経過日数ではなく残り日数を出します。
   *   こちらの作業は終わっていて、待っているのは相手の返事だからです。 */
  const right  = wait
    ? '<span class="days ' + waitClass(x.waitLeft) + '">' + esc(waitLabel(x.waitLeft)) + '</span>'
    : done
    ? '<span class="sent">' + esc(x.status) + (x.sentAt ? "　" + esc(x.sentAt) : "") + '</span>'
    : (x.making
        ? '<span class="days making">作成中</span>'
        : '<span class="days ' + daysClass(x.days) + '">' + esc(daysLabel(x.days)) + '</span>');

  /* ★行の左に、用件のアイコンと文字を大きく置きます。
   *   見出しは「物件名＋号室」、その下に「お名前・分類・受信日時」、
   *   いちばん下に本文の要約。ひと目で誰の何の話か分かる並びです。 */
  const bp     = splitBldg(x.building);
  const room   = bp.room || roomOf(x.content);
  const person = nameOf(x);
  /* 物件名が空のときに用件を出すと、左のアイコンと同じ言葉が二重に並ぶので出しません */
  const head   = bp.name || (room ? "" : "\u7269\u4EF6\u540D\u306A\u3057");

  return '<div class="card ' + cls + '" tabindex="0" data-row="' + x.rowNo + '">'
       +   '<div class="crow">'
       +     '<div class="cico">'
       +       '<span class="ic">' + topicIconSvg(topic) + '</span>'
       +       '<span class="ct">' + esc(topic || "\u305D\u306E\u4ED6") + '</span>'
       +     '</div>'
       +     '<div class="cbody">'
       +       '<div class="card-top">'
       +         '<span class="hl">' + esc(head)
       +           (room ? '<span class="room">' + esc(room) + '\u53F7\u5BA4</span>' : '')
       +         '</span>'
       +         (x.manual ? '<span class="topic manual">要手入力</span>' : '')
       +         (x.tmplMark
                   ? '<span class="topic ' + (x.tmplMark === "要添付" ? "attach" : "edit") + '">'
                     + esc(x.tmplMark) + '</span>'
                   : '')
       +         right
       +       '</div>'
       +       '<div class="card-sub">'
       +         (person ? '<span class="nm">' + esc(person) + ' \u69D8</span>' : '')
       +         '<span class="kind' + soudan + '">' + esc(x.kind || "未分類") + '</span>'
       +         '<span class="time">' + esc(x.received) + '</span>'
       +       '</div>'
       +       '<p class="snip">' + esc(snip) + '</p>'
       +     '</div>'
       +   '</div>'
       + '</div>';
}

function eigyouCard(x) {
  const cls = x.flag === "疑い" ? "doubt" : "";
  /* ★ここも一覧と同じ並びにします。左に「営業」の絵と文字を置き、
   *   目を通さなくても、返信せずに完了へ送るものだと分かるようにします */
  return '<div class="card eigyou" data-row="' + x.rowNo + '">'
       +   '<div class="crow">'
       +     '<div class="cico">'
       +       '<span class="ic">' + topicIconSvg("営業") + '</span>'
       +       '<span class="ct">営業</span>'
       +     '</div>'
       +     '<div class="cbody">'
       +       '<div class="card-top">'
       +         '<span class="flag ' + cls + '">' + esc(x.flag) + '</span>'
       +         '<span class="bldg">' + esc(x.subject || "（件名なし）") + '</span>'
       +       '</div>'
       +       '<div class="card-top"><span class="time">' + esc(x.received) + '　'
       +         esc(x.from) + '</span></div>'
       +       '<p class="snip">' + esc(x.content) + '</p>'
       +       (x.reason ? '<p class="reason">判定の根拠：' + esc(x.reason) + '</p>' : "")
       +       '<button class="unbtn" type="button">営業ではない（承認待ちに戻す）</button>'
       +     '</div>'
       +   '</div>'
       + '</div>';
}

async function drawEigyou() {
  $("tabOpen").className   = "tab";
  $("tabDone").className   = "tab";
  $("tabEigyou").className = "tab on";
  $("tabAnalytics").className = "tab";

  $("list").innerHTML = '<div class="empty">読み込んでいます…</div>';
  let rows = [];
  try {
    const r = await api({ mode: "eigyou" });
    rows = (r && r.rows) || [];
    $("nEigyou").textContent = rows.length;
  } catch (e) {
    $("list").innerHTML = '<div class="empty">読み込めませんでした</div>';
    return;
  }

  const note = '<div class="eigyou-note">'
    + '営業メールとして自動で弾いたものです。承認画面には出ていません。<br>'
    + 'お客様からの問い合わせが混ざっていたら、下のボタンで戻してください。'
    + '戻すと返信案が作られ、承認待ちに並びます。</div>';

  if (!rows.length) {
    $("list").innerHTML = note + '<div class="empty">営業と判定したものはありません</div>';
    return;
  }

  $("list").innerHTML = note + rows.map(eigyouCard).join("");

  Array.prototype.forEach.call($("list").querySelectorAll(".unbtn"), function (b) {
    b.addEventListener("click", async function () {
      const card = b.closest(".card");
      const n = Number(card.dataset.row);
      if (!confirm("この案件を承認待ちに戻します。\n返信案が作られ、通常の流れに乗ります。\n\nよろしいですか？")) return;
      b.disabled = true; b.textContent = "戻しています…";
      try {
        const r = await api({ mode: "unEigyou", row: n });
        if (r && r.ok) {
          card.style.opacity = ".4";
          b.textContent = "戻しました";
          const now = Number($("nEigyou").textContent);
          if (!isNaN(now) && now > 0) $("nEigyou").textContent = now - 1;
          toast("承認待ちに戻しました。返信案ができるまで数分かかります。");
        } else {
          b.disabled = false; b.textContent = "営業ではない（承認待ちに戻す）";
          toast((r && r.error) || "戻せませんでした", true);
        }
      } catch (e) {
        b.disabled = false; b.textContent = "営業ではない（承認待ちに戻す）";
        toast(e.message, true);
      }
    });
  });
}

function topicIconSvg(name) {

       + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';

/* 用件の並びは横1列です。端まで来たら、その側の送りボタンを隠します */
function syncFilterArrows() {
  const box = $("filters"), pv = $("fPrev"), nx = $("fNext");
  if (!box || !pv || !nx) return;
  const over = box.scrollWidth - box.clientWidth;
  const canPrev = over > 8 && box.scrollLeft > 4;
  const canNext = over > 8 && box.scrollLeft < over - 4;
  pv.className = "fscroll prev" + (canPrev ? " show" : "");
  nx.className = "fscroll next" + (canNext ? " show" : "");
}

function drawFilters(rows) {
  /* ★用件の絵のならびは、一覧からは外しました。
   *   ここで選り分けても使いどころが無く、場所だけ取っていたためです。
   *   ただし用件そのものは topicOf() で今までどおり見分けており、
   *   一覧の行の左の絵と、分析タブの集計には、そのまま効いています。
   *   （元に戻したいときは、この return を消してください） */
  $("filters").innerHTML = "";
  topicFilter = "";
  return;

  const box = $("filters");
  const n = {};
  rows.forEach(function (x) {
    const t = topicOf(x.content);
    if (!t) return;
    n[t] = (n[t] || 0) + 1;
  });

  const keys = Object.keys(n).sort(function (a, b) {
    if (n[b] !== n[a]) return n[b] - n[a];
    return a.localeCompare(b, "ja");
  });

  if (!keys.length) { box.innerHTML = ""; topicFilter = ""; syncFilterArrows(); return; }
  if (topicFilter && keys.indexOf(topicFilter) < 0) topicFilter = "";

  /* 問い合わせ率＝いま並んでいる件数に占める割合。「すべて」には出しません */
  const total = rows.length;
  function cell(key, label, count) {
    const rate = (key && total)
      ? '<span class="fr">' + (count / total * 100).toFixed(1) + '%</span>'
      : '';
    return '<button class="ficon' + (topicFilter === key ? " on" : "") + '"'
         + ' type="button" data-t="' + esc(key) + '">'
         +   '<span class="ic">' + topicIconSvg(label) + '</span>'
         +   '<span class="fl">' + esc(label) + '</span>'
         +   '<span class="fn">' + count + '</span>'
         +   rate
         + '</button>';
  }

  box.innerHTML = cell("", "すべて", rows.length)
    + keys.map(function (k) { return cell(k, k, n[k]); }).join("");

  syncFilterArrows();

  Array.prototype.forEach.call(box.querySelectorAll(".ficon"), function (b) {
    b.addEventListener("click", function () {
      topicFilter = b.dataset.t || "";
      drawList();
    });
  });
}

const PIE_OTHER  = "#9a9aa0";

function isClaim(topic) { return CLAIM_TOPICS.indexOf(topic) >= 0; }

/* 全案件を集計する */
function analyze() {
  const all = listOpen.concat(listWait, listDone);
  const topics = {}, blds = {};
  let claim = 0;

  all.forEach(function (x) {
    const t = topicOf(x.content) || "その他";
    topics[t] = (topics[t] || 0) + 1;
    if (isClaim(t)) claim++;

    const b = x.building || "物件名なし";
    if (!blds[b]) blds[b] = { name: b, total: 0, claim: 0, topics: {} };
    const o = blds[b];
    o.total++;
    o.topics[t] = (o.topics[t] || 0) + 1;
    if (isClaim(t)) o.claim++;
  });

  const topicList = Object.keys(topics)
    .map(function (k) { return { name: k, n: topics[k] }; })
    .sort(function (a, b) { return b.n - a.n || a.name.localeCompare(b.name, "ja"); });

  /* クレーム率の高い順。同率なら件数の多い順 */
  const bldList = Object.keys(blds).map(function (k) { return blds[k]; })
    .sort(function (a, b) {
      const ra = a.total ? a.claim / a.total : 0;
      const rb = b.total ? b.claim / b.total : 0;
      return (rb - ra) || (b.total - a.total);
    });

  return { total: all.length, claim: claim, topics: topicList, blds: bldList };
}

function pct(n, d) { return d ? (n / d * 100).toFixed(1) + "%" : "0%"; }

/* 上位5件＋その他 に丸めて、円グラフ用の並びにする */
function pieSlices(topicList, total) {
  const top = topicList.slice(0, 5).map(function (t, i) {
    return { name: t.name, n: t.n, color: PIE_COLORS[i] };
  });
  const rest = topicList.slice(5).reduce(function (a, t) { return a + t.n; }, 0);
  if (rest > 0) top.push({ name: "その他", n: rest, color: PIE_OTHER });
  return top;
}

/* ドーナツ。すき間を2pxあけて、隣り合う色が溶け合わないようにします */
function donutSvg(slices, total) {
  const R = 54, W = 22, C = 2 * Math.PI * R;
  let off = 0;
  const arcs = slices.map(function (s) {
    const len = total ? (s.n / total) * C : 0;
    const draw = Math.max(len - 2, 0.6);
    const a = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + s.color + '"'
            + ' stroke-width="' + W + '" stroke-dasharray="' + draw.toFixed(2) + ' ' + (C - draw).toFixed(2) + '"'
            + ' stroke-dashoffset="' + (-off).toFixed(2) + '"></circle>';
    off += len;
    return a;
  }).join("");
  return '<svg class="an-donut" viewBox="0 0 140 140" role="img" aria-label="用件の内訳">'
       +   '<g transform="rotate(-90 70 70)">' + arcs + '</g>'
       +   '<text class="an-dn" x="70" y="68" text-anchor="middle">' + total + '</text>'
       +   '<text class="an-dl" x="70" y="86" text-anchor="middle">件</text>'
       + '</svg>';
}
