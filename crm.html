<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM 返信の承認</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e0e10;
  --paper:#f7f6f3;
  --card:#ffffff;
  --g1:#e7e5e0;
  --g2:#c9c6bf;
  --g3:#8e8b85;
  --ink-2:#6a6862;
  --line:#c9c6bf;
  --bd:2px solid var(--ink);
  --pop:6px 6px 0 var(--ink);
  --pop-sm:4px 4px 0 var(--ink);
  --hatch:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 7px);
  --radius:0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.75; font-weight:500; letter-spacing:.005em;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:repeating-linear-gradient(135deg,#00000008 0 1px,transparent 1px 9px);
}
button,input,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 60px}

/* ---- 見出し ---- */
header{
  position:sticky; top:0; z-index:10;
  background:var(--ink); color:#fff; border-bottom:var(--bd);
  padding:11px 14px 9px; margin:0 -14px 16px;
}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:16px;margin:0;letter-spacing:.06em;font-weight:900;flex:1}
.badge{
  font-size:11.5px;font-weight:900;padding:3px 11px;border-radius:0;
  background:transparent;color:#fff;border:2px solid #fff;white-space:nowrap;
}
.badge.live{background:#fff;color:var(--ink);border-color:#fff}
.count{font-size:12.5px;color:#fff;opacity:.85;font-weight:700}
.buildtag{font-size:10.5px;color:#fff;opacity:.5;letter-spacing:.03em}

/* ---- タブ ---- */
.tabs{display:flex;gap:8px;margin-bottom:13px}
.tab{flex:1;padding:9px 8px;border:var(--bd);border-radius:0;
  background:#fff;font-size:13px;font-weight:900;color:var(--ink);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:var(--pop-sm);transition:transform .08s}
.tab:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab-n{font-size:15px;font-weight:900;letter-spacing:-.03em}

/* ---- 一覧 ---- */
.card{
  position:relative;
  background:var(--card); border:var(--bd); border-radius:0;
  padding:12px 13px; margin-bottom:11px; cursor:pointer;
  box-shadow:var(--pop-sm); transition:transform .08s,box-shadow .08s;
}
.card:hover,.card:focus-visible{transform:translate(-1px,-1px);box-shadow:var(--pop);outline:none}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.kind{
  font-size:11px;font-weight:900;padding:1px 9px;border-radius:0;
  background:#fff;border:1.5px solid var(--ink);color:var(--ink);white-space:nowrap;
}
.kind.soudan{background:var(--ink);color:#fff}
.bldg{font-weight:900;font-size:15px;flex:1;min-width:0;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:11px;color:var(--ink-2);white-space:nowrap;font-weight:700}
.snip{
  font-size:12.5px;color:var(--ink-2);margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.6;
}

/* 経過日数：塗りの濃さで急ぎを出します（0〜1日=白／2〜3日=斜線／4日以上=黒） */
.days{font-size:12px;font-weight:900;padding:2px 10px;border:1.5px solid var(--ink);
  border-radius:0;white-space:nowrap;background:#fff}
.days.fresh{background:#fff}
.days.warn{background-image:var(--hatch);background-color:var(--g1)}
.days.late{background:var(--ink);color:#fff}
.days.making{background:var(--g1);color:var(--ink-2);border-style:dashed}

.card.fresh{background:#fff}
.card.warn{background:#fff}
.card.late{background:var(--g1)}
.card.late .bldg{color:var(--ink)}
.card.making{opacity:.72}
.card.making .snip{font-style:italic}
.card.done{background:var(--paper);opacity:.75;box-shadow:none}
.card.done .bldg{color:var(--ink-2);font-weight:700}
.sent{font-size:11px;color:var(--ink-2);white-space:nowrap;font-weight:700;
  background:var(--g1);padding:2px 9px;border:1.5px solid var(--g2)}

/* ---- 詳細 ---- */
.back{
  background:#fff;border:var(--bd);padding:6px 13px;margin:0 0 12px;
  color:var(--ink);font-size:13px;font-weight:900;cursor:pointer;box-shadow:var(--pop-sm);
}
.back:active{transform:translate(3px,3px);box-shadow:none}
.sec{margin-bottom:20px}
.sec>h2{
  font-size:11.5px;font-weight:900;color:#fff;background:var(--ink);
  display:inline-block;padding:3px 10px;margin:0 0 9px;letter-spacing:.06em;
}
.box{
  background:var(--card);border:var(--bd);border-radius:0;padding:12px 14px 12px 24px;
  white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.8;
  position:relative;
}
.box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--ink)}
.box.quiet{background:#fff;color:var(--ink-2);font-size:13px}
.box.quiet::before{background:var(--g2)}
.meta{font-size:12.5px;color:var(--ink-2);margin:0 0 2px;font-weight:700}
.meta b{color:var(--ink);font-weight:900}

textarea{
  width:100%;min-height:250px;padding:15px 17px;
  background:#fff;border:var(--bd);border-radius:0;
  font-size:16px;line-height:1.95;color:var(--ink);font-weight:500;resize:vertical;
}
textarea:focus{outline:none;box-shadow:var(--pop)}
textarea.order{min-height:74px;font-size:14px;line-height:1.7}

/* ---- ボタン ---- */
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
button.act{
  font-size:14.5px;font-weight:900;padding:12px 20px;border-radius:0;border:var(--bd);
  background:#fff;color:var(--ink);cursor:pointer;box-shadow:var(--pop-sm);transition:transform .08s;
}
button.act:active{transform:translate(3px,3px);box-shadow:none}
button.act:disabled{opacity:.4;cursor:default;box-shadow:none}
button.send{background:var(--ink);border-color:var(--ink);color:#fff;flex:1;min-width:160px;box-shadow:var(--pop)}
button.send.armed{background:#fff;color:var(--ink);border-style:dashed}
button.skip{background:var(--g1)}
.act.ai{background:var(--ink);color:#fff}
.order-acts{display:flex;align-items:center;gap:12px;margin-top:9px;flex-wrap:wrap}
.order-note{font-size:12.5px;color:var(--ink-2);font-weight:700}

/* ---- 通知 ---- */
.toast{
  position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:900;
  padding:11px 22px;border:var(--bd);border-radius:0;z-index:80;box-shadow:var(--pop);
  max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s;
}
.toast.on{opacity:1}
.toast.bad{background:#fff;color:var(--ink);border-style:dashed}

/* ---- 結果表示 ---- */
.status{
  margin-top:15px;padding:11px 14px;border-radius:0;
  font-size:13.5px;line-height:1.7;border:var(--bd);font-weight:700;
  white-space:pre-wrap;word-break:break-word;background:#fff;
}
.status .stamp{display:block;font-size:11.5px;opacity:.65;margin-top:3px;font-weight:500}
.status.ok{background:var(--ink);color:#fff}
.status.bad{background:#fff;border-style:dashed}
.status.work{background:var(--g1)}

.empty{text-align:center;color:var(--ink-2);padding:50px 20px;font-size:13.5px;font-weight:700}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- 添付ファイル ---- */
.att-note{font-weight:500;font-size:11.5px;color:var(--ink-2);margin-left:8px}
.att{display:flex;flex-direction:column;gap:10px}
.att-pick{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  padding:9px 16px;border:var(--bd);border-radius:0;box-shadow:var(--pop-sm);
  background:#fff;font-size:13px;font-weight:900;cursor:pointer;user-select:none}
.att-pick:active{transform:translate(3px,3px);box-shadow:none}
.att-pick::before{content:"＋";font-size:15px;line-height:1}
.att-pick.busy{opacity:.5;pointer-events:none}
.att-list{display:flex;flex-direction:column;gap:7px}
.att-row{display:flex;align-items:center;gap:10px;padding:9px 12px;
  border:1.5px solid var(--ink);border-radius:0;background:#fff;font-size:12.5px}
.att-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.att-row .sz{color:var(--ink-2);font-size:11.5px;flex:none}
.att-row .rm{flex:none;border:none;background:transparent;color:var(--ink);
  font-size:12.5px;font-weight:900;cursor:pointer;padding:2px 4px;text-decoration:underline}
.att-empty{color:var(--ink-2);font-size:12.5px;font-weight:700}

/* ---- 原文 ---- */
.rawbox{margin-top:9px}
.rawbox>summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);padding:6px 2px;
  list-style:none;font-weight:700}
.rawbox>summary::-webkit-details-marker{display:none}
.rawbox>summary::before{content:"▸ "}
.rawbox[open]>summary::before{content:"▾ "}
.box.raw{max-height:340px;overflow-y:auto;font-size:12.5px;line-height:1.7;
  white-space:pre-wrap;margin-top:7px}

/* ---- やりとりの履歴 ---- */
.th-note{font-weight:500;font-size:11.5px;color:var(--ink-2);margin-left:8px}
.thread{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;
  padding:13px;border:var(--bd);border-radius:0;background:var(--paper)}
.thread.empty-wrap{padding:14px;background:#fff}
.th-row{display:flex;flex-direction:column;max-width:82%}
.th-row.in{align-self:flex-start;align-items:flex-start}
.th-row.out,.th-row.draft{align-self:flex-end;align-items:flex-end}
.th-who{font-size:10.5px;color:var(--ink-2);margin:0 3px 3px;font-weight:900}
.th-bub{padding:9px 12px;border-radius:0;font-size:13px;line-height:1.75;
  border:1.5px solid var(--ink);white-space:pre-wrap;word-break:break-word;background:#fff}
.th-row.out .th-bub{background:var(--ink);color:#fff}
.th-row.draft .th-bub{background:#fff;border-style:dashed}
.th-row.cur .th-bub{box-shadow:var(--pop-sm)}
.th-more{border:none;background:transparent;color:var(--ink-2);font-size:11.5px;
  cursor:pointer;padding:2px 4px;align-self:flex-start;margin-top:2px;
  font-weight:700;text-decoration:underline}
.th-empty{color:var(--ink-2);font-size:12.5px;font-weight:700}

/* ---- 送信前プレビュー ---- */
.prev summary{font-size:13px;font-weight:900;cursor:pointer;color:var(--ink);
  padding:9px 13px;border:var(--bd);border-radius:0;background:#fff;list-style:none}
.prev summary::-webkit-details-marker{display:none}
.prev summary::before{content:"▸ "}
.prev[open] summary::before{content:"▾ "}
.prev[open] summary{margin-bottom:9px}

/* ---- 営業タブ ---- */
.card.eigyou{background:var(--paper);box-shadow:none;border-style:dashed}
.card.eigyou .bldg{color:var(--ink-2);font-weight:700}
.flag{font-size:11px;font-weight:900;padding:2px 9px;border:1.5px solid var(--ink);
  background:var(--ink);color:#fff;white-space:nowrap}
.flag.doubt{background:#fff;color:var(--ink);border-style:dashed}
.reason{font-size:11px;color:var(--ink-2);margin:7px 0 0;line-height:1.6}
.unbtn{margin-top:10px;padding:7px 13px;border:1.5px solid var(--ink);
  border-radius:0;background:#fff;font-size:12px;font-weight:900;
  color:var(--ink);cursor:pointer}
.unbtn:hover{background:var(--ink);color:#fff}
.eigyou-note{font-size:12.5px;color:var(--ink-2);line-height:1.7;font-weight:700;
  padding:11px 13px;border:1.5px dashed var(--ink);border-radius:0;
  background:#fff;margin-bottom:13px}

/* ============================================================
 *  横に並べる（パソコンのとき）
 * ============================================================ */
@media (min-width: 1000px) {
  .wrap{max-width:1360px}
  header{margin-left:-14px;margin-right:-14px}
  .split{display:flex;gap:20px;align-items:flex-start}
  #listView{width:392px;flex:none;position:sticky;top:70px;
    max-height:calc(100vh - 92px);overflow-y:auto;padding:3px 5px 20px 3px}
  #detailView{flex:1;min-width:0;background:#fff;border:var(--bd);
    box-shadow:var(--pop);padding:20px 22px}
  #detailView.hide{display:block}
  #detailView.hide .sec,
  #detailView.hide .acts,
  #detailView.hide .status,
  #detailView.hide .back{display:none}
  #detailView.hide::before{
    content:"左の一覧から案件を選んでください";
    display:flex;align-items:center;justify-content:center;
    height:340px;color:var(--ink-2);font-size:13.5px;font-weight:700;
    border:2px dashed var(--g2);background:var(--paper);
  }
  .back{display:none}
  .card.on{background:var(--g1);box-shadow:var(--pop)}
  .card.on::after{content:"";position:absolute;left:-2px;top:-2px;bottom:-2px;
    width:8px;background:var(--ink)}
  #listView .card{padding:11px 12px;margin-bottom:9px}
  #listView .snip{-webkit-line-clamp:1}
}

/* ============================================================
 *  集中編集（返信本文をクリックすると開きます）
 *
 *  背景をぼかして、いま書いている1件だけが見えるようにします。
 *  上部に問い合わせの原文を置くので、見ながら書けます。
 * ============================================================ */
.veil{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(14,14,16,.42);
  -webkit-backdrop-filter:blur(7px) grayscale(1);
  backdrop-filter:blur(7px) grayscale(1);
  padding:22px;
}
.veil[data-open="true"]{display:grid;place-items:center;animation:veilIn .16s ease-out}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
.zen{width:min(920px,96vw);max-height:94vh;display:flex;flex-direction:column;
  background:#fff;border:var(--bd);box-shadow:10px 10px 0 var(--ink);animation:zenIn .18s ease-out}
@keyframes zenIn{from{transform:translateY(10px)}to{transform:none}}
.zen-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 16px;border-bottom:var(--bd);background:var(--ink);color:#fff}
.zen-head h3{margin:0;font-size:17px;font-weight:900;letter-spacing:-.01em}
.zen-head .meta{font-size:11.5px;font-weight:700;color:#fff;opacity:.75;margin:0}
.zen-close{margin-left:auto;border:2px solid #fff;background:transparent;color:#fff;
  padding:6px 13px;font-size:12px;font-weight:900;cursor:pointer}
.zen-close:hover{background:#fff;color:var(--ink)}
.zen-ask{padding:13px 16px;border-bottom:1px solid var(--g2);background:var(--paper);
  max-height:26vh;overflow:auto}
.zen-ask .cap{font-size:10.5px;font-weight:900;letter-spacing:.08em;color:var(--ink-2);margin-bottom:6px}
.zen-ask .body{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;
  border-left:8px solid var(--ink);padding-left:12px}
.zen-edit{flex:1;min-height:0;display:flex}
.zen-edit textarea{flex:1;border:0;box-shadow:none;min-height:0;height:100%;
  font-size:17px;line-height:2.05;padding:20px 22px;resize:none}
.zen-edit textarea:focus{box-shadow:none;outline:none}
.zen-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 16px;border-top:var(--bd);background:var(--g1)}
.zen-foot .n{font-size:12px;font-weight:900}
.zen-foot .r{margin-left:auto;display:flex;gap:9px}
@media(max-width:640px){
  .veil{padding:0}
  .zen{width:100vw;max-height:100vh;height:100vh;box-shadow:none;border:0}
  .zen-foot .r{width:100%;margin-left:0}
  .zen-foot .r .act{flex:1}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hd">
      <h1>CRM 返信の承認</h1>
      <span class="badge" id="mode">確認中</span>
    </div>
    <div class="count" id="count"></div>
    <div class="buildtag" id="buildtag"></div>
  </header>

  <!-- 一覧 -->
  <div class="split" id="split">
  <section id="listView">
    <div class="tabs">
      <button class="tab on" id="tabOpen" type="button">未返信<span class="tab-n" id="nOpen"></span></button>
      <button class="tab" id="tabDone" type="button">完了<span class="tab-n" id="nDone"></span></button>
      <button class="tab" id="tabEigyou" type="button">営業<span class="tab-n" id="nEigyou"></span></button>
    </div>
    <div id="list"></div>
  </section>

  <!-- 詳細 -->
  <section id="detailView" class="hide">
    <button class="back" id="back">← 一覧にもどる</button>

    <div class="sec">
      <p class="meta" id="dMeta"></p>
      <p class="meta" id="dSubject"></p>
    </div>

    <div class="sec">
      <h2>今回の問い合わせ</h2>
      <div class="box quiet" id="dContent"></div>
      <details class="rawbox">
        <summary>通知メールの原文を見る</summary>
        <div class="box quiet raw" id="dRaw"></div>
      </details>
    </div>

    <div class="sec" id="dThreadSec">
      <h2>やりとりの履歴<span class="th-note" id="dThreadNote"></span></h2>
      <div class="thread" id="dThread"></div>
    </div>

    <div class="sec">
      <h2>返信の本文（ここを直せます）</h2>
      <textarea id="dDraft" spellcheck="false"></textarea>
    </div>

    <div class="sec">
      <h2>AIに書いてもらう<span class="att-note">どう返すかを一言で。文面はAIが整えます</span></h2>
      <textarea id="dOrder" class="order" spellcheck="false"
        placeholder="例：2番手申込の1番手確認への回答。1番手は審査中で、結果が出たら連絡すると伝えて。"></textarea>
      <div class="order-acts">
        <button class="act ai" id="bAi" type="button">この指示で書いてもらう</button>
        <span class="order-note" id="dOrderNote"></span>
      </div>
    </div>

    <div class="sec">
      <h2>添付ファイル<span class="att-note">請求書・領収書など。2件まで</span></h2>
      <div class="att">
        <label class="att-pick" for="dFile">ファイルを選ぶ</label>
        <input type="file" id="dFile" accept=".pdf,application/pdf,image/*" hidden>
        <div class="att-list" id="dFiles"></div>
      </div>
    </div>

    <details class="sec prev" id="dPrevBox">
      <summary>実際に送られる形を見る（宛名・署名つき）</summary>
      <div class="box" id="dPreview"></div>
    </details>

    <div class="status hide" id="status"></div>

    <div class="acts">
      <button class="act" id="bSave">下書きを保存</button>
      <button class="act skip" id="bSkip">対応しない</button>
      <button class="act send" id="bSend">送信する</button>
    </div>
  </section>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- 集中編集：返信本文をクリックすると開きます（ui-2026-08-19i） -->
<div class="veil" id="veil" role="dialog" aria-modal="true" aria-label="返信本文の編集">
  <div class="zen">
    <div class="zen-head">
      <h3 id="zenTitle">案件</h3>
      <p class="meta" id="zenMeta"></p>
      <button class="zen-close" id="zenClose" type="button">閉じる（Esc）</button>
    </div>
    <div class="zen-ask">
      <div class="cap">今回の問い合わせ</div>
      <div class="body" id="zenAsk"></div>
    </div>
    <div class="zen-edit"><textarea id="zenText" spellcheck="false"></textarea></div>
    <div class="zen-foot">
      <span class="n" id="zenCount">0 文字</span>
      <div class="r">
        <button class="act skip" id="zenBack" type="button">編集をやめる</button>
        <button class="act send" id="zenOk" type="button">この内容にする</button>
      </div>
    </div>
  </div>
</div>


<script>
const API = "https://script.google.com/macros/s/AKfycbws85BB01CV2U4yJO6z3gHnH5ZjQp0rPviQ_XTpGR2c5p5uxJUKCwxz_M47y3TViLD1/exec";

/* ---------- APIを呼ぶ（JSONP） ---------- */
let jsonpSeq = 0;
function api(params) {
  return new Promise(function (resolve, reject) {
    const cb = "__crm_cb_" + (++jsonpSeq) + "_" + Date.now();
    const s  = document.createElement("script");
    let done = false;

    const timer = setTimeout(function () {
      if (done) return;
      cleanup();
      reject(new Error("応答がありません。通信状況を確認してください"));
    }, 25000);

    function cleanup() {
      done = true;
      clearTimeout(timer);
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
    }

    window[cb] = function (data) { cleanup(); resolve(data); };

    const q = Object.keys(params)
      .map(function (k) { return k + "=" + encodeURIComponent(params[k]); })
      .join("&");

    s.src = API + "?" + q + "&callback=" + cb;
    s.onerror = function () { if (!done) { cleanup(); reject(new Error("接続できません")); } };
    document.head.appendChild(s);
  });
}

/* ---------- 画面の部品 ---------- */
const UI_BUILD = "ui-2026-08-19i";
const $ = function (id) { return document.getElementById(id); };
let cur  = null;
let isTest = true;

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast on" + (bad ? " bad" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.className = "toast"; }, 3200);
}

/* 結果を画面に残す。トーストと違い、自動では消えません */
function setStatus(kind, msg) {
  const el = $("status");
  if (!kind) { el.className = "status hide"; el.textContent = ""; return; }
  const d = new Date();
  const hh = ("0" + d.getHours()).slice(-2), mm = ("0" + d.getMinutes()).slice(-2),
        ss = ("0" + d.getSeconds()).slice(-2);
  el.className = "status " + kind;
  el.textContent = msg;
  const t = document.createElement("span");
  t.className = "stamp";
  t.textContent = hh + ":" + mm + ":" + ss;
  el.appendChild(t);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- 一覧 ---------- */
let listOpen = [];
let listDone = [];
let listTab  = "open";

function daysLabel(d) {
  if (d === null || d === undefined) return "";
  if (d === 0) return "本日";
  return d + "日経過";
}
function daysClass(d) {
  if (d === null || d === undefined) return "fresh";
  if (d >= 4) return "late";
  if (d >= 2) return "warn";
  return "fresh";
}

function cardHtml(x, done) {
  const soudan = x.kind === "入居者相談" ? " soudan" : "";
  /* 返信案がまだ無い行（未処理）は、作成中と分かるようにします。
   * F列を消して作り直すとき、案件が消えたように見えないためです。 */
  const snip   = x.making
    ? "返信案を作っています…（10分ほどで並びます）"
    : (x.draft || "").replace(/\s+/g, " ").slice(0, 90);
  const cls    = (done ? "done" : daysClass(x.days)) + (x.making ? " making" : "");
  const right  = done
    ? '<span class="sent">' + esc(x.status) + (x.sentAt ? "　" + esc(x.sentAt) : "") + '</span>'
    : (x.making
        ? '<span class="days making">作成中</span>'
        : '<span class="days ' + daysClass(x.days) + '">' + esc(daysLabel(x.days)) + '</span>');

  return '<div class="card ' + cls + '" tabindex="0" data-row="' + x.rowNo + '">'
       +   '<div class="card-top">'
       +     '<span class="kind' + soudan + '">' + esc(x.kind || "未分類") + '</span>'
       +     '<span class="bldg">' + esc(x.building || "物件名なし") + '</span>'
       +     right
       +   '</div>'
       +   '<div class="card-top"><span class="time">' + esc(x.received) + '</span></div>'
       +   '<p class="snip">' + esc(snip) + '</p>'
       + '</div>';
}

function eigyouCard(x) {
  const cls = x.flag === "疑い" ? "doubt" : "";
  return '<div class="card eigyou" data-row="' + x.rowNo + '">'
       +   '<div class="card-top">'
       +     '<span class="flag ' + cls + '">' + esc(x.flag) + '</span>'
       +     '<span class="bldg">' + esc(x.subject || "（件名なし）") + '</span>'
       +   '</div>'
       +   '<div class="card-top"><span class="time">' + esc(x.received) + '　'
       +     esc(x.from) + '</span></div>'
       +   '<p class="snip">' + esc(x.content) + '</p>'
       +   (x.reason ? '<p class="reason">判定の根拠：' + esc(x.reason) + '</p>' : "")
       +   '<button class="unbtn" type="button">営業ではない（承認待ちに戻す）</button>'
       + '</div>';
}

async function drawEigyou() {
  $("tabOpen").className   = "tab";
  $("tabDone").className   = "tab";
  $("tabEigyou").className = "tab on";

  $("list").innerHTML = '<div class="empty">読み込んでいます…</div>';
  let rows = [];
  try {
    const r = await api({ mode: "eigyou" });
    rows = (r && r.rows) || [];
    $("nEigyou").textContent = rows.length;
  } catch (e) {
    $("list").innerHTML = '<div class="empty">読み込めませんでした</div>';
    return;
  }

  const note = '<div class="eigyou-note">'
    + '営業メールとして自動で弾いたものです。承認画面には出ていません。<br>'
    + 'お客様からの問い合わせが混ざっていたら、下のボタンで戻してください。'
    + '戻すと返信案が作られ、承認待ちに並びます。</div>';

  if (!rows.length) {
    $("list").innerHTML = note + '<div class="empty">営業と判定したものはありません</div>';
    return;
  }

  $("list").innerHTML = note + rows.map(eigyouCard).join("");

  Array.prototype.forEach.call($("list").querySelectorAll(".unbtn"), function (b) {
    b.addEventListener("click", async function () {
      const card = b.closest(".card");
      const n = Number(card.dataset.row);
      if (!confirm("この案件を承認待ちに戻します。\n返信案が作られ、通常の流れに乗ります。\n\nよろしいですか？")) return;
      b.disabled = true; b.textContent = "戻しています…";
      try {
        const r = await api({ mode: "unEigyou", row: n });
        if (r && r.ok) {
          card.style.opacity = ".4";
          b.textContent = "戻しました";
          const now = Number($("nEigyou").textContent);
          if (!isNaN(now) && now > 0) $("nEigyou").textContent = now - 1;
          toast("承認待ちに戻しました。返信案ができるまで数分かかります。");
        } else {
          b.disabled = false; b.textContent = "営業ではない（承認待ちに戻す）";
          toast((r && r.error) || "戻せませんでした", true);
        }
      } catch (e) {
        b.disabled = false; b.textContent = "営業ではない（承認待ちに戻す）";
        toast(e.message, true);
      }
    });
  });
}

function drawList() {
  if (listTab === "eigyou") { drawEigyou(); return; }

  const rows = (listTab === "open") ? listOpen : listDone;
  const done = (listTab === "done");

  $("tabOpen").className   = "tab" + (done ? "" : " on");
  $("tabDone").className   = "tab" + (done ? " on" : "");
  $("tabEigyou").className = "tab";

  if (!rows.length) {
    $("list").innerHTML = '<div class="empty">'
      + (done ? "完了した案件はまだありません" : "未返信の案件はありません")
      + '</div>';
    return;
  }

  $("list").innerHTML = rows.map(function (x) { return cardHtml(x, done); }).join("");
  if (cur) {
    const on = $("list").querySelector('.card[data-row="' + cur.rowNo + '"]');
    if (on) on.classList.add("on");
  }

  Array.prototype.forEach.call($("list").querySelectorAll(".card"), function (el) {
    const n = Number(el.dataset.row);
    el.addEventListener("click", function () { openDetail(n); });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(n); }
    });
  });
}

async function loadList() {
  $("list").innerHTML = '<div class="empty">読み込んでいます…</div>';
  try {
    const r = await api({ mode: "list" });
    if (!r.ok) throw new Error(r.error || "読み込めませんでした");

    listOpen = r.open || [];
    listDone = r.done || [];
    isTest   = !!r.test;

    $("mode").textContent = isTest ? "テスト送信中" : "本番送信";
    $("mode").className   = isTest ? "badge" : "badge live";
    $("buildtag").textContent = "画面 " + UI_BUILD
      + " ／ API "  + (r.build || "?")
      + " ／ 一覧 " + (r.listBuild || "?");

    $("nOpen").textContent = listOpen.length;
    $("nDone").textContent = listDone.length;
    $("nEigyou").textContent = (r.nEigyou != null) ? r.nEigyou : "";

    const late = listOpen.filter(function (x) { return x.days >= 4; }).length;
    $("count").textContent = listOpen.length
      ? "返信を待っている案件が " + listOpen.length + " 件"
        + (late ? "（うち4日以上たっているものが " + late + " 件）" : "")
      : "返信を待っている案件はありません";

    drawList();

  } catch (e) {
    $("list").innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

/* ---------- 詳細 ---------- */
let openSeq = 0;          // 連打したとき、古い応答で画面が戻らないようにする

async function openDetail(rowNo) {
  const seq = ++openSeq;

  // ① まず、一覧が持っている情報だけで先に描く。通信を待たない。
  const hint = (listOpen.concat(listDone))
    .filter(function (x) { return x.rowNo === rowNo; })[0];

  Array.prototype.forEach.call($("list").querySelectorAll(".card"), function (el) {
    el.classList.toggle("on", Number(el.dataset.row) === rowNo);
  });

  cur = { rowNo: rowNo };
  $("dMeta").innerHTML = hint
    ? "<b>" + esc(hint.building || "物件名なし") + "</b>　" + esc(hint.kind) + "　" + esc(hint.received)
    : "読み込んでいます…";
  $("dSubject").innerHTML   = "";
  $("dContent").textContent = "";
  $("dRaw").textContent     = "読み込んでいます…";
  $("dDraft").value         = hint ? (hint.draft || "") : "";
  $("dPreview").textContent = "";
  $("dPrevBox").open        = false;
  $("dOrder").value         = "";
  $("dOrderNote").textContent = "";
  $("dThread").className    = "thread empty-wrap";
  $("dThread").innerHTML    = '<div class="th-empty">読み込んでいます…</div>';
  $("dThreadNote").textContent = "";
  $("dFiles").innerHTML     = "";
  attFiles = [];

  setStatus(null);
  disarm();
  if (!isWide()) $("listView").classList.add("hide");
  $("detailView").classList.remove("hide");
  if (!isWide()) window.scrollTo(0, 0);

  /* ② 問い合わせは1回だけ。
   *    以前は detail・thread・attachList を別々に投げていましたが、
   *    GASはリクエストごとにプロジェクトを読み込み直すため、
   *    その起動コストを3回払うことになり、表示が重くなっていました。
   *    いまは detail の返り値に履歴と添付が入っています。 */
  try {
    const d = await api({ mode: "detail", row: rowNo });
    if (seq !== openSeq) return;                 // 別の案件が開かれていたら捨てる
    if (!d.ok) { toast(d.error, true); return; }

    cur = d;
    $("dMeta").innerHTML    = "<b>" + esc(d.building || "物件名なし") + "</b>　"
                            + esc(d.kind) + "　" + esc(d.received);
    $("dSubject").innerHTML = "件名：" + esc(d.subject);
    $("dContent").textContent = d.content;
    $("dRaw").textContent     = d.raw || "（原文がありません。crmFillRaw を実行してください）";
    if (!$("dDraft").value) $("dDraft").value = d.draft;   // 入力中なら上書きしない
    $("dPreview").textContent = d.preview;

    drawThread(d.thread || null);

    if (d.attach && d.attach.ok) attFiles = d.attach.files || [];
    else                          attFiles = [];
    drawAttach();
  } catch (e) {
    if (seq === openSeq) {
      toast(e.message, true);
      $("dThread").innerHTML = '<div class="th-empty">履歴を読み込めませんでした</div>';
      drawAttach();
    }
  }
}

function isWide() { return window.matchMedia("(min-width: 1000px)").matches; }

/* 処理が終わった案件を、通信せずに画面から片づける */
function finishRow(rowNo, toDone) {
  const i = listOpen.map(function (x) { return x.rowNo; }).indexOf(rowNo);
  if (i >= 0) {
    const x = listOpen.splice(i, 1)[0];
    if (toDone) { x.status = toDone; listDone.unshift(x); }
  }
  $("nOpen").textContent = listOpen.length;
  $("nDone").textContent = listDone.length;
  const late = listOpen.filter(function (x) { return x.days >= 4; }).length;
  $("count").textContent = listOpen.length
    ? "返信を待っている案件が " + listOpen.length + " 件"
      + (late ? "（うち4日以上たっているものが " + late + " 件）" : "")
    : "返信を待っている案件はありません";
  drawList();
}

function backToList() {
  $("detailView").classList.add("hide");
  $("listView").classList.remove("hide");
  cur = null;
  if (!isWide()) loadList();
}

/* ============================================================
 *  送信される形を作り直す
 *
 *  プレビューは「保存済みの本文」から作られます。
 *  画面で書き換えた直後は古いままなので、開いたときに作り直します。
 * ============================================================ */
let prevSeq = 0;

async function refreshPreview() {
  if (!cur) return;
  const text = $("dDraft").value.trim();
  if (!text) { $("dPreview").textContent = "（本文が空です）"; return; }

  const seq = ++prevSeq;
  const rowNo = cur.rowNo;
  $("dPreview").textContent = "作っています…";

  try {
    const r = await api({ mode: "preview", row: rowNo, text: text });
    if (seq !== prevSeq) return;
    $("dPreview").textContent = (r && r.ok) ? r.preview
      : "作れませんでした：" + ((r && r.error) || "");
  } catch (e) {
    if (seq === prevSeq) $("dPreview").textContent = "作れませんでした：" + e.message;
  }
}

/* ============================================================
 *  AIに書いてもらう
 *
 *  台帳には書きません。返ってきた文面を返信本文の欄に入れるだけです。
 *  内容を見てから「下書きを保存」を押してください。
 * ============================================================ */
async function askAi() {
  if (!cur) return;

  const order = $("dOrder").value.trim();
  if (!order) {
    $("dOrderNote").textContent = "どう返すかを書いてから押してください";
    $("dOrder").focus();
    return;
  }

  const cur0 = $("dDraft").value.trim();
  if (cur0 && !confirm("いま書かれている返信の本文を、AIの文面で置き換えます。よろしいですか。")) return;

  const b = $("bAi");
  b.disabled = true;
  b.textContent = "書いています…";
  $("dOrderNote").textContent = "";
  setStatus("work", "AIが文面を作っています。10秒ほどかかります。");

  const seq = openSeq;
  try {
    const r = await api({ mode: "rewrite", row: cur.rowNo, order: order });
    if (seq !== openSeq) return;                 // 別の案件が開かれていたら捨てる

    if (!r.ok) {
      setStatus("bad", "書けませんでした\n理由：" + (r.error || "（理由が返っていません）"));
      return;
    }
    $("dDraft").value = r.text;
    setStatus("ok", "文面ができました。内容を確かめて、直すところがあれば直してください。"
                  + "\nまだ保存していません。");
    $("dOrderNote").textContent = "保存するまで台帳は変わりません";
    disarm();
    if ($("dPrevBox").open) refreshPreview();
  } catch (e) {
    if (seq === openSeq) setStatus("bad", "書けませんでした\n理由：" + e.message);
  } finally {
    b.disabled = false;
    b.textContent = "この指示で書いてもらう";
  }
}

/* ---------- 保存 ---------- */
async function save(silent) {
  if (!cur) return false;
  const text = $("dDraft").value.trim();
  if (!text) { setStatus("bad", "本文が空です。保存しませんでした。"); return false; }

  const b = $("bSave");
  const label = b.textContent;
  b.disabled = true;
  b.textContent = "保存しています…";
  setStatus("work", silent ? "送信の前に下書きを保存しています…" : "下書きを保存しています…");

  try {
    const r = await api({ mode: "save", row: cur.rowNo, text: text });
    if (!r.ok) {
      setStatus("bad", "保存できませんでした\n理由：" + (r.error || "（理由が返っていません）"));
      return false;
    }
    cur.draft = text;
    setStatus("ok", silent
      ? "下書きを保存しました。つづけて送信できます。"
      : "下書きを保存しました（" + cur.rowNo + "行目）");
    return true;
  } catch (e) {
    setStatus("bad", "保存できませんでした\n理由：" + e.message);
    return false;
  } finally {
    b.disabled = false;
    b.textContent = label;
  }
}

/* ---------- 対応しない ---------- */
async function skip() {
  if (!cur) return;
  if (!confirm("この案件に返信しません。よろしいですか？")) return;

  const b = $("bSkip");
  b.disabled = true;
  b.textContent = "記録しています…";
  setStatus("work", "対応しないものとして記録しています…");

  try {
    const r = await api({ mode: "skip", row: cur.rowNo });
    if (!r.ok) {
      setStatus("bad", "記録できませんでした\n理由：" + (r.error || "（理由が返っていません）"));
      b.disabled = false; b.textContent = "対応しない";
      return;
    }
    setStatus("ok", "完了として記録しました。");
    finishRow(cur.rowNo, "対応不要");
    setTimeout(backToList, 1000);
  } catch (e) {
    setStatus("bad", "記録できませんでした\n理由：" + e.message);
    b.disabled = false; b.textContent = "対応しない";
  }
}

/* ---------- 送信 ----------
 *  以前は「2回押す」方式でしたが、通信に1〜2秒かかるため
 *  1回目の保存中にもう一度押すと、送信段階に進めませんでした。
 *  確認ダイアログ方式に変更し、押した瞬間にボタンを止めます。
 */
function disarm() {                     // 残っている呼び出し先（何もしません）
  const b = $("bSend");
  if (b) { b.disabled = false; b.textContent = "送信する"; b.classList.remove("armed"); }
}

async function send() {
  if (!cur) return;
  const b = $("bSend");
  if (b.disabled) return;               // 連打を無視します

  b.disabled = true;
  b.textContent = "準備しています…";

  try {
    const ok = await save(true);        // 送信前に必ず保存
    if (!ok) return;

    const att = attFiles.length
      ? "\n添付：" + attFiles.map(function (f) { return f.name; }).join("、") + "\n"
      : "\n添付：なし\n";

    const q = isTest
      ? "テスト送信します。\n\n宛先はテスト用アドレスです。\nお客様には届きません。\n" + att + "\nよろしいですか？"
      : "★本番送信します。\n\n" + cur.from + " に実際に届きます。\n" + att + "\nよろしいですか？";

    if (!confirm(q)) {
      setStatus("work", "送信を取りやめました。まだ送っていません。");
      return;
    }

    b.textContent = "送信しています…";
    b.classList.add("armed");
    setStatus("work", "送信しています…（1〜2秒かかります）");

    const r = await api({ mode: "send", row: cur.rowNo });

    if (!r || !r.ok) {
      setStatus("bad", "送信できませんでした\n理由：" +
        ((r && r.error) ? r.error : JSON.stringify(r)));
      return;
    }

    setStatus("ok", r.test
      ? "テスト送信しました。\n宛先：" + r.to +
        "\n（お客様には届いていません。台帳も更新していません）"
      : "送信しました。\n宛先：" + r.to + "\n台帳を「送信済」に更新しました。");
    if (!r.test) finishRow(cur.rowNo, "送信済");
    setTimeout(backToList, 2000);

  } catch (e) {
    setStatus("bad", "送信できませんでした\n理由：" + e.message);
  } finally {
    b.disabled = false;
    b.textContent = "送信する";
    b.classList.remove("armed");
  }
}

/* ============================================================
 *  やりとりの履歴
 *
 *  同じメールアドレスの案件を、古い順に並べます。
 *  お客様からの分は左、こちらが送った分は右に出します。
 * ============================================================ */
function threadBubble(x) {
  const who = x.side === "in" ? "お客様"
            : (x.side === "out" ? "弊社" : "弊社（この案件の返信案）");
  const long = x.text.length > 220;
  const head = long ? x.text.slice(0, 220) + "…" : x.text;
  return '<div class="th-row ' + x.side + (x.cur ? " cur" : "") + '">'
       +   '<div class="th-who">' + esc(who) + (x.at ? "　" + esc(x.at) : "") + '</div>'
       +   '<div class="th-bub" data-full="' + esc(x.text) + '">' + esc(head) + '</div>'
       +   (long ? '<button class="th-more" type="button">全文を見る</button>' : "")
       + '</div>';
}

function drawThread(r) {
  const box  = $("dThread");
  const note = $("dThreadNote");
  const items = (r && r.items) || [];

  if (!r || !r.ok) {
    box.className = "thread empty-wrap";
    box.innerHTML = '<div class="th-empty">履歴を読み込めませんでした</div>';
    return;
  }
  if (items.length <= 1) {
    box.className = "thread empty-wrap";
    box.innerHTML = '<div class="th-empty">この方とのやりとりは、今回がはじめてです</div>';
    note.textContent = "";
    return;
  }

  box.className = "thread";
  note.textContent = (r.mail || "") + "　" + items.length + "件";
  box.innerHTML = items.map(threadBubble).join("");

  Array.prototype.forEach.call(box.querySelectorAll(".th-more"), function (b) {
    b.addEventListener("click", function () {
      const bub = b.previousElementSibling;
      bub.textContent = bub.dataset.full;
      b.remove();
    });
  });

  box.scrollTop = box.scrollHeight;
}

async function loadThread() {
  if (!cur) return;
  try { drawThread(await api({ mode: "thread", row: cur.rowNo })); }
  catch (e) { drawThread(null); }
}

/* ============================================================
 *  添付ファイル
 *
 *  ファイルの中身はJSONPでは送れない（URLに載りきらない）ため、
 *  ここだけ POST で送ります。読み書きの他の処理はJSONPのままです。
 * ============================================================ */
function apiPost(params) {
  return fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(params),
    redirect: "follow",
  }).then(function (r) { return r.text(); })
    .then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error("応答が読み取れませんでした"); }
    });
}

let attFiles = [];

function drawAttach() {
  const box = $("dFiles");
  if (!attFiles.length) {
    box.innerHTML = '<div class="att-empty">添付なしで送信します</div>';
    return;
  }
  box.innerHTML = attFiles.map(function (f) {
    const kb = Math.max(1, Math.round(f.size / 1024));
    return '<div class="att-row" data-id="' + esc(f.id) + '">'
         +   '<span class="nm">' + esc(f.name) + '</span>'
         +   '<span class="sz">' + kb + ' KB</span>'
         +   '<button class="rm" type="button">はずす</button>'
         + '</div>';
  }).join("");

  Array.prototype.forEach.call(box.querySelectorAll(".rm"), function (b) {
    b.addEventListener("click", function () {
      const id = b.parentNode.dataset.id;
      dropAttach(id);
    });
  });
}

async function loadAttach() {
  attFiles = [];
  drawAttach();
  if (!cur) return;
  try {
    const r = await api({ mode: "attachList", row: cur.rowNo });
    if (r && r.ok) { attFiles = r.files || []; drawAttach(); }
  } catch (e) { /* 一覧が取れなくても、送信そのものは止めない */ }
}

async function pickAttach(file) {
  if (!cur || !file) return;
  if (attFiles.length >= 2) { setStatus("bad", "添付は2件までです"); return; }
  if (file.size > 5000000) { setStatus("bad", "ファイルが大きすぎます（約5MBまで）"); return; }

  const lab = document.querySelector(".att-pick");
  lab.classList.add("busy");
  setStatus("work", "ファイルを読み込んでいます…");

  try {
    const dataUrl = await new Promise(function (resolve, reject) {
      const rd = new FileReader();
      rd.onload  = function () { resolve(rd.result); };
      rd.onerror = function () { reject(new Error("ファイルを読めませんでした")); };
      rd.readAsDataURL(file);
    });

    setStatus("work", "添付を預けています…");
    const r = await apiPost({ mode: "attach", row: cur.rowNo, name: file.name, data: dataUrl });

    if (!r || !r.ok) {
      setStatus("bad", "添付できませんでした\n理由：" + ((r && r.error) || "（理由が返っていません）"));
      return;
    }
    attFiles = r.files || [];
    drawAttach();
    setStatus("ok", "添付しました：" + file.name);

  } catch (e) {
    setStatus("bad", "添付できませんでした\n理由：" + e.message);
  } finally {
    lab.classList.remove("busy");
    $("dFile").value = "";
  }
}

async function dropAttach(id) {
  if (!cur) return;
  try {
    const r = await api({ mode: "attachDrop", row: cur.rowNo, id: id });
    if (r && r.ok) { attFiles = r.files || []; drawAttach(); setStatus("ok", "添付をはずしました"); }
    else setStatus("bad", "はずせませんでした");
  } catch (e) { setStatus("bad", "はずせませんでした\n理由：" + e.message); }
}

/* ---------- 起動 ---------- */
$("tabOpen").addEventListener("click", function () { listTab = "open"; drawList(); });
$("tabDone").addEventListener("click", function () { listTab = "done"; drawList(); });
$("tabEigyou").addEventListener("click", function () { listTab = "eigyou"; drawList(); });
$("dFile").addEventListener("change", function (e) {
  const f = e.target.files && e.target.files[0];
  if (f) pickAttach(f);
});
$("back").addEventListener("click", backToList);
$("bSave").addEventListener("click", function () { save(false); });
$("bAi").addEventListener("click", askAi);
$("dPrevBox").addEventListener("toggle", function () {
  if ($("dPrevBox").open) refreshPreview();
});
$("bSkip").addEventListener("click", skip);
$("bSend").addEventListener("click", send);


/* ============================================================
 *  起動
 *
 *  ★URLに ?row=27 が付いていたら、その案件を直接開きます。
 *    LINEの通知から開いたとき、一覧に着地するとどれのことか分かりません。
 *    通知には案件ごとのURLが入っているので、そのまま開けるようにします。
 * ============================================================ */
function bootRow_() {
  try {
    const m = String(location.search || "").match(/[?&]row=(\d+)/);
    return m ? Number(m[1]) : 0;
  } catch (e) { return 0; }
}


/* ============================================================
 *  集中編集
 *
 *  返信本文をクリックすると、背景をぼかした編集画面が開きます。
 *  上部に問い合わせの原文を出すので、見ながら書けます。
 *
 *  ★ #dDraft の値と行き来するだけです。保存・送信・AI指示は
 *    これまでどおり #dDraft を読むので、動きは変わりません。
 * ============================================================ */
(function zenEdit() {
  const main = $("dDraft");
  const veil = $("veil");
  const zen  = $("zenText");
  if (!main || !veil || !zen) return;
  let before = "";

  function tally() { $("zenCount").textContent = zen.value.length.toLocaleString() + " 文字"; }

  function open() {
    if (veil.getAttribute("data-open") === "true") return;
    before = main.value;
    zen.value = main.value;
    /* 詳細の dMeta は「<b>物件名</b>　分類　受信日時」の形です。
       太字の部分を見出しに、残りを小さく添えます。 */
    const bold = $("dMeta").querySelector("b");
    $("zenTitle").textContent = bold ? bold.textContent : "案件";
    $("zenMeta").textContent  = $("dMeta").textContent.replace(bold ? bold.textContent : "", "").trim();
    $("zenAsk").textContent   = ($("dContent") ? $("dContent").textContent : "");
    veil.setAttribute("data-open", "true");
    document.body.style.overflow = "hidden";
    tally();
    zen.focus();
    try { zen.setSelectionRange(zen.value.length, zen.value.length); } catch (e) {}
  }

  /* keep=true … 書いた内容を残す／false … 開く前に戻す */
  function close(keep) {
    main.value = keep ? zen.value : before;
    veil.removeAttribute("data-open");
    document.body.style.overflow = "";
    main.blur();
  }

  main.addEventListener("focus", open);
  main.addEventListener("click", open);
  zen.addEventListener("input", tally);
  $("zenOk").addEventListener("click", function () { close(true); });
  $("zenClose").addEventListener("click", function () { close(true); });
  $("zenBack").addEventListener("click", function () { close(false); });
  veil.addEventListener("mousedown", function (e) { if (e.target === veil) close(true); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && veil.getAttribute("data-open") === "true") close(true);
  });
})();

(function boot() {
  const row = bootRow_();
  loadList();                       // 一覧は裏で読み込んでおく（戻ったときのため）
  if (row >= 2) openDetail(row);    // 指定があれば、その案件をすぐ開く
})();
</script>
