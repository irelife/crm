/* ───────────────────────────────────────────────────────────────
 * 気づいたこと
 *
 * ★数字から機械的に出しています。AIには聞いていません。
 *   （通信もお金もかからず、その場で出ます。同じ数字なら同じ文が出ます）
 *   現場の事情は入っていないので、考えるきっかけとして使ってください。
 * ─────────────────────────────────────────────────────────────── */
const DOC_TOPICS = ["保管場所使用承諾書", "名義変更", "領収書", "火災保険", "更新", "口座変更"];

function advise(a) {
  const out = [];
  const total = a.total;
  if (!total) return out;

  const pctN = function (n) { return (n / total * 100).toFixed(1) + "%"; };

  /* ① 手が止まっているもの。いちばん先に出します */
  const late = listOpen.filter(function (x) { return x.days >= LATE_DAYS; }).length;
  if (late > 0) {
    out.push({
      lv: "hi",
      t: LATE_DAYS + "日以上たっている案件が " + late + " 件あります",
      d: "内容の良し悪しより、返事が遅いことのほうが不満につながります。"
       + "今日はここから片づけると、いちばん効きます。",
    });
  }

  /* ② クレーム・不具合の割合 */
  if (a.claim > 0) {
    const r = a.claim / total * 100;
    if (r >= 30) {
      out.push({
        lv: "hi",
        t: "クレーム・不具合が全体の " + r.toFixed(1) + "%（" + a.claim + " 件）を占めています",
        d: "3件に1件がこの種類です。設備の定期点検と、入居時の説明（ゴミ・騒音・駐車のきまり）を"
         + "見直すと、そもそもの発生が減ります。",
      });
    } else if (r >= 15) {
      out.push({
        lv: "mid",
        t: "クレーム・不具合は全体の " + r.toFixed(1) + "%（" + a.claim + " 件）です",
        d: "いまは問い合わせの中心ではありません。下の物件別で、特定の物件に偏っていないかを見てください。",
      });
    }
  }

  /* ③ いちばん多い用件 */
  const t1 = a.topics[0];
  if (t1 && t1.n >= 2 && t1.n / total >= 0.15) {
    out.push({
      lv: "mid",
      t: "いちばん多い用件は「" + t1.name + "」で " + t1.n + " 件（" + pctN(t1.n) + "）です",
      d: "同じ問いが繰り返し来ています。定型の案内文を1本用意しておけば、"
       + "返信の手間が減り、答えのばらつきも無くなります。",
    });
  }

  /* ④ 書類の依頼 */
  const doc = a.topics.filter(function (t) { return DOC_TOPICS.indexOf(t.name) >= 0; })
                      .reduce(function (n, t) { return n + t.n; }, 0);
  if (doc >= 3) {
    out.push({
      lv: "low",
      t: "書類まわりの依頼が合わせて " + doc + " 件（" + pctN(doc) + "）あります",
      d: "承諾書・名義変更・領収書などは、様式と手順が決まっているものです。"
       + "様式を1か所にまとめて案内できるようにすると、その場で返せます。",
    });
  }

  /* ⑤ 営業メール */
  const eig = a.topics.filter(function (t) { return t.name === "営業"; })[0];
  if (eig && eig.n >= 2) {
    out.push({
      lv: "low",
      t: "営業メールが " + eig.n + " 件（" + pctN(eig.n) + "）混ざっています",
      d: "自動の振り分けをすり抜けたものです。差出人か、よく出てくる言い回しを"
       + "振り分けの語句に足すと、一覧が静かになります。",
    });
  }

  /* ⑥ 問い合わせが集中している物件 */
  const many = a.blds.slice().sort(function (x, y) { return y.total - x.total; })[0];
  if (many && many.total >= 3 && many.name !== "物件名なし" && many.total / total >= 0.15) {
    const t = Object.keys(many.topics)
      .map(function (k) { return { k: k, n: many.topics[k] }; })
      .sort(function (x, y) { return y.n - x.n; })[0];
    out.push({
      lv: "mid",
      t: "「" + many.name + "」に問い合わせが集中しています（" + many.total + " 件・" + pctN(many.total) + "）",
      d: "内訳のいちばん多いものは「" + t.k + "」で " + t.n + " 件。"
       + "個別に返し続けるより、一度現地を見るか、掲示で全戸に知らせるほうが早く収まります。",
    });
  }

  /* ⑦ クレーム率の高い物件 */
  const bad = a.blds.filter(function (b) {
    return b.total >= 3 && b.name !== "物件名なし" && (b.claim / b.total) >= 0.5;
  }).slice(0, 2);
  bad.forEach(function (b) {
    const t = Object.keys(b.topics)
      .map(function (k) { return { k: k, n: b.topics[k] }; })
      .filter(function (x) { return isClaim(x.k); })
      .sort(function (x, y) { return y.n - x.n; })[0];
    out.push({
      lv: "hi",
      t: "「" + b.name + "」はクレーム・不具合の割合が "
       + (b.claim / b.total * 100).toFixed(0) + "% です",
      d: (t ? "多いのは「" + t.k + "」で " + t.n + " 件。" : "")
       + "建物の問題か、住まわれている方の組み合わせの問題かで、打つ手が変わります。"
       + "続くようなら、次の募集の条件（保証会社・入居審査・ペットや楽器の可否）を"
       + "見直す判断材料になります。",
    });
  });

  /* ⑧ 何も出なかったとき */
  if (!out.length) {
    out.push({
      lv: "low",
      t: "いまのところ、目立った偏りはありません",
      d: "件数が増えると、物件や用件の偏りが見えてきます。この欄はそのとき自動で埋まります。",
    });
  }
  return out;
}

function drawStats() {
  $("tabOpen").className = "tab";
  $("tabWait").className = "tab";
  $("tabDone").className = "tab";
  $("tabEigyou").className = "tab";
  $("tabAnalytics").className = "tab on";
  $("filters").innerHTML = "";
  syncFilterArrows();

  const a = analyze();
  if (!a.total) {
    $("list").innerHTML = '<div class="empty">集計できる案件がまだありません</div>';
    return;
  }

  const slices = pieSlices(a.topics, a.total);
  const claimRate = a.claim / a.total * 100;

  /* ① 要約 */
  let html = '<div class="an-hero">'
    + anBackdrop()
    + '<div class="an-hero-in">'
    +   '<p class="an-eyebrow">問い合わせの中身</p>'
    +   '<div class="an-figs">'
    +     '<div class="an-fig"><span class="v">' + a.total + '</span><span class="k">総件数</span></div>'
    +     '<div class="an-fig"><span class="v ' + (claimRate >= 40 ? "bad" : "") + '">' + claimRate.toFixed(1) + '%</span>'
    +       '<span class="k">クレーム・不具合の割合</span></div>'
    +     '<div class="an-fig"><span class="v txt">' + esc(a.topics[0].name) + '</span><span class="k">いちばん多い用件</span></div>'
    +   '</div>'
    +   '<p class="an-note">対象：いま読み込んでいる未返信・返事待ち・完了の ' + a.total + ' 件です。</p>'
    + '</div></div>';

  /* ② 用件の内訳（円グラフ＋一覧） */
  /* 気づいたこと */
  const tips = advise(a);
  html += '<div class="an-card"><h3 class="an-h">気づいたこと'
        + '<span class="an-sub">上の数字から機械的に出しています。'
        + '現場の事情は入っていないので、考えるきっかけとしてお使いください</span></h3>'
        + '<div class="an-tips">'
        + tips.map(function (v) {
            return '<div class="an-tip ' + v.lv + '">'
                 +   '<p class="an-tip-t">' + esc(v.t) + '</p>'
                 +   '<p class="an-tip-d">' + esc(v.d) + '</p>'
                 + '</div>';
          }).join("")
        + '</div></div>';

  html += '<div class="an-card"><h3 class="an-h">用件の内訳</h3>'
    + '<div class="an-pie">' + donutSvg(slices, a.total)
    + '<div class="an-legend">'
    + slices.map(function (s) {
        return '<div class="an-lg">'
             +   '<i style="background:' + s.color + '"></i>'
             +   '<span class="nm">' + esc(s.name) + '</span>'
             +   '<span class="n">' + s.n + '</span>'
             +   '<span class="r">' + pct(s.n, a.total) + '</span>'
             + '</div>';
      }).join("")
    + '</div></div></div>';

  /* ③ 物件別 */
  html += '<div class="an-card"><h3 class="an-h">物件別'
    + '<span class="an-sub">クレーム・不具合の割合が高い順。押すと内訳が開きます</span></h3>'
    + a.blds.map(function (b, i) {
        const r = b.claim / b.total * 100;
        const lv = r >= 50 ? " hi" : (r >= 25 ? " mid" : "");
        const top3 = Object.keys(b.topics)
          .map(function (k) { return { k: k, n: b.topics[k] }; })
          .sort(function (x, y) { return y.n - x.n; })
          .slice(0, 3)
          .map(function (t) { return esc(t.k) + " " + t.n; })
          .join(" ・ ");
        const detail = Object.keys(b.topics)
          .map(function (k) { return { k: k, n: b.topics[k] }; })
          .sort(function (x, y) { return y.n - x.n; })
          .map(function (t) {
            return '<div class="an-dt' + (isClaim(t.k) ? " claim" : "") + '">'
                 +   '<span class="k">' + esc(t.k) + '</span>'
                 +   '<span class="n">' + t.n + '</span>'
                 +   '<span class="r">' + pct(t.n, b.total) + '</span>'
                 + '</div>';
          }).join("");
        return '<div class="an-b" data-i="' + i + '">'
             +   '<div class="an-b-head">'
             +     '<span class="an-b-nm">' + esc(b.name) + '</span>'
             +     '<span class="an-b-n">' + b.total + '件</span>'
             +     '<span class="an-b-r' + lv + '">クレーム ' + r.toFixed(1) + '%</span>'
             +   '</div>'
             +   '<div class="an-bar' + lv + '"><i style="width:' + r.toFixed(1) + '%"></i></div>'
             +   '<p class="an-b-top">' + top3 + '</p>'
             +   '<div class="an-b-detail">' + detail + '</div>'
             + '</div>';
      }).join("")
    + '</div>';

  $("list").innerHTML = html;

  Array.prototype.forEach.call($("list").querySelectorAll(".an-b"), function (el) {
    el.addEventListener("click", function () { el.classList.toggle("open"); });
  });
}

function drawList() {
  if (listTab === "eigyou") { $("filters").innerHTML = ""; drawEigyou(); return; }
  if (listTab === "stats")  { drawStats(); return; }

  const wait = (listTab === "wait");
  const done = (listTab === "done");
  /* 3日以上でしぼるのは未返信のときだけです */
  if (wait || done) lateOnly = false;
  const base = wait ? listWait : (done ? listDone : listOpen);
  const all  = lateOnly
    ? base.filter(function (x) { return x.days >= LATE_DAYS; })
    : base;

  $("btnOpen").className = "stat" + (!wait && !done && !lateOnly ? " on" : "");
  $("btnLate").className = "stat" + (lateOnly ? " on" : "");
  $("btnDone").className = "stat" + (done ? " on" : "");

  $("tabOpen").className   = "tab" + (!wait && !done ? " on" : "");
  $("tabWait").className   = "tab" + (wait ? " on" : "");
  $("tabDone").className   = "tab" + (done ? " on" : "");
  $("tabEigyou").className = "tab";
  $("tabAnalytics").className = "tab";

  drawFilters(all);

  const rows = topicFilter
    ? all.filter(function (x) { return topicOf(x.content) === topicFilter; })
    : all;

  if (!rows.length) {
    $("list").innerHTML = '<div class="empty">'
      + (topicFilter
          ? "「" + esc(topicFilter) + "」の案件はありません"
          : (lateOnly ? "3日以上たっている案件はありません"
              : (wait ? "返事を待っている案件はありません"
                  : (done ? "完了した案件はまだありません" : "未返信の案件はありません"))))
      + '</div>';
    return;
  }

  $("list").innerHTML = rows.map(function (x) { return cardHtml(x, done, wait); }).join("");
  if (cur) {
    const on = $("list").querySelector('.card[data-row="' + cur.rowNo + '"]');
    if (on) on.classList.add("on");
  }

  Array.prototype.forEach.call($("list").querySelectorAll(".card"), function (el) {
    const n = Number(el.dataset.row);
    el.addEventListener("click", function () { openDetail(n); });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(n); }
    });
  });
}

/* ───────────────────────────────────────────────────────────────
 * 画面から隠す
 *
 * ★台帳から本当に消すのはクラウド側（crmApi.gs）の仕事です。
 *   向こうに delete の受け口が無いあいだの逃げ道として、
 *   「この端末の画面からだけ隠す」を用意しています。
 *   隠した行番号はこの端末の localStorage に残るので、
 *   他の人の画面や台帳には影響しません。いつでも戻せます。
 * ─────────────────────────────────────────────────────────────── */
const HIDE_KEY = "crm.hiddenRows.v1";

function hiddenRows() {
  try {
    const v = JSON.parse(localStorage.getItem(HIDE_KEY) || "[]");
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}

function saveHidden(list) {
  try { localStorage.setItem(HIDE_KEY, JSON.stringify(list)); } catch (e) {}
}

function hideRow(rowNo) {
  const list = hiddenRows();
  if (list.indexOf(rowNo) < 0) list.push(rowNo);
  saveHidden(list);
}

function unhideAll() {
  saveHidden([]);
  loadList();
}

/* 隠しているものを一覧から外します */
function applyHidden() {
  const h = hiddenRows();
  if (!h.length) { drawHiddenBar(0); return; }
  let n = 0;
  [listOpen, listWait, listDone].forEach(function (arr) {
    for (let i = arr.length - 1; i >= 0; i--) {
      if (h.indexOf(arr[i].rowNo) >= 0) { arr.splice(i, 1); n++; }
    }
  });
  drawHiddenBar(n);
}

function drawHiddenBar(n) {
  const bar = $("hiddenBar");
  if (!bar) return;
  if (!n) { bar.className = "hidden-bar hide"; bar.innerHTML = ""; return; }
  bar.className = "hidden-bar";
  bar.innerHTML = '<span>この端末の画面から隠している問い合わせが ' + n + ' 件あります'
                + '（台帳には残っています）</span>'
                + '<button type="button" id="bUnhide">ぜんぶ表示に戻す</button>';
  $("bUnhide").addEventListener("click", unhideAll);
}

async function loadList() {
  $("list").innerHTML = '<div class="empty">読み込んでいます…</div>';
  try {
    const r = await api({ mode: "list" });
    if (!r.ok) throw new Error(r.error || "読み込めませんでした");

    listOpen = r.open || [];
    listWait = r.waiting || [];
    listDone = r.done || [];
    applyHidden();          /* 隠しているものを、数える前に外します */
    isTest   = !!r.test;

    $("mode").textContent = isTest ? "テスト送信中" : "本番送信";
    $("mode").className   = isTest ? "badge" : "badge live";
    $("buildtag").textContent = "画面 " + UI_BUILD
      + " ／ API "  + (r.build || "?")
      + " ／ 一覧 " + (r.listBuild || "?");

    $("nOpen").textContent = listOpen.length;
    $("nWait").textContent = listWait.length;
    $("nDone").textContent = listDone.length;
    $("nEigyou").textContent = (r.nEigyou != null) ? r.nEigyou : "";

    /* ヘッダーの数字。件数はここで見せるので、下の文章は0件のときだけにします */
    const late = listOpen.filter(function (x) { return x.days >= LATE_DAYS; }).length;
    $("sOpen").textContent = listOpen.length;
    $("sLate").textContent = late;
    $("sDone").textContent = listDone.length;
    $("sLate").className = late ? "v late" : "v muted";

    $("count").textContent = listOpen.length
      ? ""
      : "返信を待っている案件はありません";

    drawList();

  } catch (e) {
    $("list").innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}


/* ============================================================
 *  進捗ステップ
 *
 *  受信から完了までを一直線に並べ、いまどこかを示します。
 *  下に「次にやること」を一言で出します。
 * ============================================================ */
const FLOW_STEPS = ["受信", "返信案ができた", "承認まち", "送信", "返事まち", "完了"];

/* いまが何番目か（0始まり）を、案件の置かれている場所から決めます */
function flowIndexOf(rowNo) {
  const inDone = listDone.filter(function (x) { return x.rowNo === rowNo; })[0];
  if (inDone) return 5;
  const inWait = listWait.filter(function (x) { return x.rowNo === rowNo; })[0];
  if (inWait) return 4;
  const inOpen = listOpen.filter(function (x) { return x.rowNo === rowNo; })[0];
  if (inOpen && inOpen.making) return 1;
  return 2;
}

/* 次にやること */
function flowNextText(i, hint) {
  if (i === 1) return "返信案ができるまで待ちます。10分ほどで一覧に並びます。";
  if (i === 2) {
    const need = [];
    if (hint && hint.manual) need.push("手入力が要る箇所");
    if (hint && hint.tmplMark) need.push(String(hint.tmplMark));
    return "返信の本文を確かめて、下の「送信して完了」を押します。"
         + (need.length ? "（" + need.join("・") + "の確認を忘れずに）" : "");
  }
  if (i === 4) {
    const left = (hint && typeof hint.waitLeft === "number") ? hint.waitLeft : null;
    return "お客様からの返事を待っています。"
         + (left !== null ? "あと " + left + " 日で期限です。" : "");
  }
  if (i === 5) return "この案件は完了しています。やることはありません。";
  return "";
}

function drawFlow(rowNo, hint) {
  const box = $("dFlow");
  if (!box) return;
  const now = flowIndexOf(rowNo);
  const steps = FLOW_STEPS.map(function (nm, i) {
    const cls = i < now ? "st done" : (i === now ? "st now" : "st");
    const mark = i < now ? "✓" : String(i + 1);
    return '<div class="' + cls + '">'
         +   '<span class="dot">' + mark + '</span>'
         +   '<span class="nm">' + esc(nm) + '</span>'
         + '</div>';
  }).join("");
  const next = flowNextText(now, hint);
  box.innerHTML = '<div class="fl">' + steps + '</div>'
    + (next ? '<div class="fl-next"><span class="lb">次にやること</span>'
            + '<span class="tx">' + esc(next) + '</span></div>' : "");
}

/* ---------- 詳細 ---------- */
let openSeq = 0;          // 連打したとき、古い応答で画面が戻らないようにする

async function openDetail(rowNo) {
  const seq = ++openSeq;

  /* ① まず、一覧が持っている情報だけで先に描く。通信を待たない。
   *   ★返事待ちタブの行も探します。入れ忘れると、そのタブから開いたとき
   *     見出しが「読み込んでいます…」のままになります。 */
  const hint = (listOpen.concat(listWait, listDone))
    .filter(function (x) { return x.rowNo === rowNo; })[0];

  Array.prototype.forEach.call($("list").querySelectorAll(".card"), function (el) {
    el.classList.toggle("on", Number(el.dataset.row) === rowNo);
  });

  cur = { rowNo: rowNo };
  /* ★送信前に人の作業が要る案件は、見出しにも出します。
   *   一覧のチップだけだと、詳細を開いた時点で見えなくなるためです。
   *   送信ボタンを押す直前に目に入る位置に置いています。 */
  const markHtml = (hint && hint.tmplMark)
    ? '　<span class="topic ' + (hint.tmplMark === "要添付" ? "attach" : "edit") + '">'
      + esc(hint.tmplMark) + '</span>'
    : "";
  $("dMeta").innerHTML = hint
    ? "<b>" + esc(hint.building || "物件名なし") + "</b>　" + esc(hint.kind)
      + '　<span class="nw">' + esc(hint.received) + "</span>" + markHtml
    : "読み込んでいます…";
  $("dSubject").innerHTML   = "";
  $("dContent").textContent = "";
  $("dRaw").textContent     = "読み込んでいます…";
  $("dDraft").value         = hint ? (hint.draft || "") : "";
  syncDraftBtn();
  wrapCache = null;         /* 宛名・署名の控えを捨てます */
  $("dOrder").value         = "";
  $("dOrderNote").textContent = "";
  $("dThread").className    = "thread empty-wrap";
  $("dThread").innerHTML    = '<div class="th-empty">読み込んでいます…</div>';
  $("dThreadNote").textContent = "";
  $("dFiles").innerHTML     = "";
  attFiles = [];

  drawFlow(rowNo, hint);

  setStatus(null);
  disarm();
  if (!isWide()) $("listView").classList.add("hide");
  $("detailView").classList.remove("hide");
  document.body.style.overflow = "hidden";
  $("detailView").scrollTop = 0;

  /* ② 問い合わせは1回だけ。
   *    以前は detail・thread・attachList を別々に投げていましたが、
   *    GASはリクエストごとにプロジェクトを読み込み直すため、
   *    その起動コストを3回払うことになり、表示が重くなっていました。
   *    いまは detail の返り値に履歴と添付が入っています。 */
  try {
    const d = await api({ mode: "detail", row: rowNo });
    if (seq !== openSeq) return;                 // 別の案件が開かれていたら捨てる
    if (!d.ok) { toast(d.error, true); return; }

    cur = d;
    $("dMeta").innerHTML    = "<b>" + esc(d.building || "物件名なし") + "</b>　"
                            + esc(d.kind)
                            + '　<span class="nw">' + esc(d.received) + "</span>";
    $("dSubject").innerHTML = "件名：" + esc(d.subject);
    $("dContent").textContent = d.content;
    $("dRaw").textContent     = d.raw || "（原文がありません。crmFillRaw を実行してください）";
    if (!$("dDraft").value) $("dDraft").value = d.draft;   // 入力中なら上書きしない


    drawThread(d.thread || null);

    if (d.attach && d.attach.ok) attFiles = d.attach.files || [];
    else                          attFiles = [];
    drawAttach();
  } catch (e) {
    if (seq === openSeq) {
      toast(e.message, true);
      $("dThread").innerHTML = '<div class="th-empty">履歴を読み込めませんでした</div>';
      drawAttach();
    }
  }
}

/* ★以前は1000px以上で左右に並べていました。いまは1件をまん中に開くので、
 *   一覧は隠さず、背景に置いたままにします（640px以下だけ切り替えます）。 */
function isWide() { return window.matchMedia("(min-width: 641px)").matches; }

/* 処理が終わった案件を、通信せずに画面から片づける */
function finishRow(rowNo, toDone, toWait) {
  const i = listOpen.map(function (x) { return x.rowNo; }).indexOf(rowNo);
  if (i >= 0) {
    const x = listOpen.splice(i, 1)[0];
    if (toDone) {
      x.status = toDone;
      /* ★返事待ちで送ったときは、完了ではなく返事待ちタブへ移します。
       *   期限は crmApi.gs が送信日＋WAIT_DAYS で入れています。
       *   ここでは画面をすぐ動かすための仮の値を置くだけで、
       *   次に一覧を読み直せば台帳の値に入れ替わります。 */
      if (toWait) {
        x.waitLeft = (typeof WAIT_DAYS_UI === "number") ? WAIT_DAYS_UI : 7;
        listWait.push(x);
        listWait.sort(function (a, b) { return a.waitLeft - b.waitLeft; });
      } else {
        listDone.unshift(x);
      }
    }
  }
  $("nOpen").textContent = listOpen.length;
  $("nWait").textContent = listWait.length;
  $("nDone").textContent = listDone.length;
  const late = listOpen.filter(function (x) { return x.days >= LATE_DAYS; }).length;
  $("count").textContent = listOpen.length
    ? "返信を待っている案件が " + listOpen.length + " 件"
      + (late ? "（うち3日以上たっているものが " + late + " 件）" : "")
    : "返信を待っている案件はありません";
  drawList();
}

function backToList() {
  $("detailView").classList.add("hide");
  document.body.style.overflow = "";
  $("listView").classList.remove("hide");
  cur = null;
  if (!isWide()) loadList();
}

/* ============================================================
 *  送信される形を作り直す
 *
 *  プレビューは「保存済みの本文」から作られます。
 *  画面で書き換えた直後は古いままなので、開いたときに作り直します。
 * ============================================================ */
let prevSeq = 0;

/* ───────────────────────────────────────────────────────────────
 * 宛名と署名
 *
 * ★宛名と署名を付けるのはクラウド側（crmApi.gs）です。送信の直前に
 *   本文の前後へ足しています。台帳に入っているのは本文だけです。
 *   そのため、この画面から宛名・署名そのものを書き換えることは
 *   できません（できるようにするには、向こうに受け口が要ります）。
 *   代わりに、mode:"preview" で組み上がった形をもらい、本文の前と
 *   後ろを切り出して、書く画面の上下にそのまま出しています。
 *   ＝いま何が送られるのかが、書きながら分かります。
 * ─────────────────────────────────────────────────────────────── */
let wrapCache = null;      /* { row, head, foot } */

async function loadWrap() {
  if (!cur) return null;
  const rowNo = cur.rowNo;
  if (wrapCache && wrapCache.row === rowNo) return wrapCache;

  const body = ($("dDraft").value || "").trim();
  if (!body) return null;

  const seq = ++prevSeq;
  try {
    const r = await api({ mode: "preview", row: rowNo, text: body });
    if (seq !== prevSeq) return null;
    if (!r || !r.ok || !r.preview) return null;

    const i = r.preview.indexOf(body);
    if (i < 0) return null;                       /* 本文が見つからなければ出しません */
    wrapCache = {
      row:  rowNo,
      head: r.preview.slice(0, i).replace(/\s+$/, ""),
      foot: r.preview.slice(i + body.length).replace(/^\s+/, ""),
    };
    return wrapCache;
  } catch (e) { return null; }
}

/* 書く画面の上下に、宛名と署名を出します */
async function drawWrap() {
  const top = $("zenTo"), bot = $("zenSign");
  if (!top || !bot) return;
  top.className = "zen-band hide";
  bot.className = "zen-band hide";

  const w = await loadWrap();
  if (!w) return;
  if (w.head) {
    top.className = "zen-band";
    top.innerHTML = '<span class="zb-cap">ここは自動で付きます</span>'
                  + '<span class="zb-t">' + esc(w.head) + '</span>';
  }
  if (w.foot) {
    bot.className = "zen-band";
    bot.innerHTML = '<span class="zb-cap">ここは自動で付きます</span>'
                  + '<span class="zb-t">' + esc(w.foot) + '</span>';
  }
}

/* ============================================================
 *  AIに書いてもらう
 *
 *  台帳には書きません。返ってきた文面を返信本文の欄に入れるだけです。
 *  内容を見てから「下書きを保存」を押してください。
 * ============================================================ */
async function askAi() {
  if (!cur) return;

  const order = $("dOrder").value.trim();
  if (!order) {
    $("dOrderNote").textContent = "どう返すかを書いてから押してください";
    $("dOrder").focus();
    return;
  }

  const cur0 = $("dDraft").value.trim();
  if (cur0 && !confirm("いま書かれている返信の本文を、AIの文面で置き換えます。よろしいですか。")) return;

  const b = $("bAi");
  b.disabled = true;
  b.textContent = "書いています…";
  $("dOrderNote").textContent = "";
  setStatus("work", "AIが文面を作っています。10秒ほどかかります。");

  const seq = openSeq;
  try {
    const r = await api({ mode: "rewrite", row: cur.rowNo, order: order });
    if (seq !== openSeq) return;                 // 別の案件が開かれていたら捨てる

    if (!r.ok) {
      setStatus("bad", "書けませんでした\n理由：" + (r.error || "（理由が返っていません）"));
      return;
    }
    $("dDraft").value = r.text;
    syncDraftBtn();
    setStatus("ok", "文面ができました。内容を確かめて、直すところがあれば直してください。"
                  + "\nまだ保存していません。");
    $("dOrderNote").textContent = "保存するまで台帳は変わりません";
    disarm();
  } catch (e) {
    if (seq === openSeq) setStatus("bad", "書けませんでした\n理由：" + e.message);
  } finally {
    b.disabled = false;
    b.textContent = "この指示で書いてもらう";
  }
}

/* ---------- 保存 ---------- */
async function save(silent) {
  if (!cur) return false;
  const text = $("dDraft").value.trim();
  if (!text) { setStatus("bad", "本文が空です。保存しませんでした。"); return false; }

  const b = $("bSave");
  const label = b.textContent;
  b.disabled = true;
  b.textContent = "保存しています…";
  setStatus("work", silent ? "送信の前に下書きを保存しています…" : "下書きを保存しています…");

  try {
    const r = await api({ mode: "save", row: cur.rowNo, text: text });
    if (!r.ok) {
      setStatus("bad", "保存できませんでした\n理由：" + (r.error || "（理由が返っていません）"));
      return false;
    }
    cur.draft = text;
    setStatus("ok", silent
      ? "下書きを保存しました。つづけて送信できます。"
      : "下書きを保存しました（" + cur.rowNo + "行目）");
    return true;
  } catch (e) {
    setStatus("bad", "保存できませんでした\n理由：" + e.message);
    return false;
  } finally {
    b.disabled = false;
    b.textContent = label;
  }
}

/* ---------- 完了にする（返信せずに片づける） ----------
 *  ★台帳のステータスは「対応不要」のまま変えていません。
 *    画面の言い方だけを「完了にする」に直しています。
 *    送信した案件も、この案件も、一覧では同じ「完了」に入ります。 */
async function skip() {
  if (!cur) return;
  if (!confirm("返信せずに完了にします。よろしいですか？")) return;

  const b = $("bSkip");
  b.disabled = true;
  b.textContent = "記録しています…";
  setStatus("work", "完了として記録しています…");

  try {
    const r = await api({ mode: "skip", row: cur.rowNo });
    if (!r.ok) {
      setStatus("bad", "記録できませんでした\n理由：" + (r.error || "（理由が返っていません）"));
      b.disabled = false; b.textContent = "完了にする";
      return;
    }
    setStatus("ok", "完了として記録しました。");
    finishRow(cur.rowNo, "対応不要");
    setTimeout(backToList, 1000);
  } catch (e) {
    setStatus("bad", "記録できませんでした\n理由：" + e.message);
    b.disabled = false; b.textContent = "完了にする";
  }
}

/* ---------- 削除する ----------
 *  ★台帳から消す処理はクラウド側（crmApi.gs）にあります。
 *    この画面は mode:"delete" を投げるだけです。クラウド側にまだ
 *    受け口が無いときは、その旨をそのまま画面に出します。
 *  ★元に戻せないので、押す前に必ず確認を出します。 */
function removeRow(rowNo) {
  [listOpen, listWait, listDone].forEach(function (arr) {
    const i = arr.map(function (x) { return x.rowNo; }).indexOf(rowNo);
    if (i >= 0) arr.splice(i, 1);
  });
  $("nOpen").textContent = listOpen.length;
  $("nWait").textContent = listWait.length;
  $("nDone").textContent = listDone.length;
  $("sOpen").textContent = listOpen.length;
  $("sDone").textContent = listDone.length;
  const late = listOpen.filter(function (x) { return x.days >= LATE_DAYS; }).length;
  $("sLate").textContent = late;
  $("sLate").className = late ? "v late" : "v muted";
}

async function delRow() {
  if (!cur) return;

  const who = ($("dMeta").textContent || "").trim().slice(0, 40);
  if (!confirm("この問い合わせを削除します。\n\n" + who
             + "\n\n削除すると元に戻せません。よろしいですか？")) return;

  const b = $("bDel");
  b.disabled = true;
  b.textContent = "削除しています…";
  setStatus("work", "削除しています…");

  try {
    const r = await api({ mode: "delete", row: cur.rowNo });
    if (!r.ok) { fallbackHide(r.error || "（理由が返っていません）"); return; }
    setStatus("ok", "台帳から削除しました。");
    removeRow(cur.rowNo);
    setTimeout(backToList, 800);
  } catch (e) {
    fallbackHide(e.message);
  }

  /* 台帳から消せなかったとき。せめて画面から外せるようにします */
  function fallbackHide(why) {
    const b2 = $("bDel");
    if (confirm("台帳からは削除できませんでした。\n理由：" + why
              + "\n\n（クラウド側にまだ削除の受け口がありません）\n\n"
              + "代わりに、この端末の画面からだけ隠しますか？\n"
              + "台帳には残ります。あとで「ぜんぶ表示に戻す」で戻せます。")) {
      hideRow(cur.rowNo);
      removeRow(cur.rowNo);
      drawHiddenBar(hiddenRows().length);
      setStatus("ok", "この端末の画面から隠しました。台帳には残っています。");
      setTimeout(backToList, 800);
      return;
    }
    setStatus("bad", "削除できませんでした\n理由：" + why);
    b2.disabled = false; b2.textContent = "削除する";
  }
}

/* ---------- 送信 ----------
 *  以前は「2回押す」方式でしたが、通信に1〜2秒かかるため
 *  1回目の保存中にもう一度押すと、送信段階に進めませんでした。
 *  確認ダイアログ方式に変更し、押した瞬間にボタンを止めます。
 */
/* 画面表示用の日数。crmApi.gs の WAIT_DAYS と合わせてください。
 * ★ここがずれても台帳は正しいままです。次に一覧を読み直せば直ります。 */
const WAIT_DAYS_UI = 7;

function disarm() {                     // 残っている呼び出し先（何もしません）
  sendButtons().forEach(function (b) {
    b.disabled = false;
    b.classList.remove("armed");
  });
  restoreSendLabels();
}

function sendButtons() {
  return [$("bSend"), $("bSendWait")].filter(Boolean);
}
function restoreSendLabels() {
  if ($("bSend"))     $("bSend").textContent     = "送信して完了";
  if ($("bSendWait")) $("bSendWait").textContent = "送信して返事待ち";
}

/* ★wait が true なら、送信後に返事待ちタブへ入ります（R列に期限が入ります）。
 *   false なら完了タブへ。どちらもメールの中身は同じです。
 *
 *   ★お客様から返信が来たときは、crmReply.gs が新しい行として台帳に足します。
 *     その行は未返信タブに並ぶので、返事待ちで送っていなくても必ず目に入ります。 */
async function send(wait) {
  if (!cur) return;
  const b   = wait ? $("bSendWait") : $("bSend");
  const all = sendButtons();
  if (!b || b.disabled) return;         // 連打を無視します

  all.forEach(function (x) { x.disabled = true; });
  b.textContent = "準備しています…";

  try {
    const ok = await save(true);        // 送信前に必ず保存
    if (!ok) return;

    const att = attFiles.length
      ? "\n添付：" + attFiles.map(function (f) { return f.name; }).join("、") + "\n"
      : "\n添付：なし\n";

    const after = wait
      ? "送信後：返事待ち（" + WAIT_DAYS_UI + "日）\n"
      : "送信後：完了\n";

    const q = isTest
      ? "テスト送信します。\n\n宛先はテスト用アドレスです。\nお客様には届きません。\n" + att + after + "\nよろしいですか？"
      : "★本番送信します。\n\n" + cur.from + " に実際に届きます。\n" + att + after + "\nよろしいですか？";

    if (!confirm(q)) {
      setStatus("work", "送信を取りやめました。まだ送っていません。");
      return;
    }

    b.textContent = "送信しています…";
    b.classList.add("armed");
    setStatus("work", "送信しています…（1〜2秒かかります）");

    const r = await api({ mode: "send", row: cur.rowNo, wait: wait ? "1" : "" });

    if (!r || !r.ok) {
      setStatus("bad", "送信できませんでした\n理由：" +
        ((r && r.error) ? r.error : JSON.stringify(r)));
      return;
    }

    setStatus("ok", r.test
      ? "テスト送信しました。\n宛先：" + r.to +
        "\n（お客様には届いていません。台帳も更新していません）"
      : "送信しました。\n宛先：" + r.to +
        (wait
          ? "\n返事待ちに入れました（あと" + WAIT_DAYS_UI + "日）。"
          : "\n台帳を「送信済」に更新しました。"));
    if (!r.test) finishRow(cur.rowNo, "送信済", wait);
    setTimeout(backToList, 2000);

  } catch (e) {
    setStatus("bad", "送信できませんでした\n理由：" + e.message);
  } finally {
    all.forEach(function (x) { x.disabled = false; x.classList.remove("armed"); });
    restoreSendLabels();
  }
}

/* ============================================================
 *  やりとりの履歴
 *
 *  同じメールアドレスの案件を、古い順に並べます。
 *  お客様からの分は左、こちらが送った分は右に出します。
 * ============================================================ */

/* 履歴の話し手アイコン。
 * ★お名前から男女を出し分ける案をいただきましたが、いまの画面には
 *   お客様のお名前を持つ項目がありません（履歴は side / at / text だけ）。
 *   そのため、ここでは「お客様」と「弊社」の出し分けにとどめています。
 *   クラウド側が氏名と性別を返すようになれば、ここを差し替えるだけです。 */
function whoIcon(side) {
  const person = '<circle cx="12" cy="8" r="4"/>'
               + '<path d="M4.4 20.4c0-4 3.4-6.6 7.6-6.6s7.6 2.6 7.6 6.6z"/>';
  const office = '<path d="M4.6 20.6V4.8h9.2v15.8z"/>'
               + '<path d="M13.8 20.6V10.2h5.6v10.4z"/>'
               + '<rect x="6.6" y="7" width="2.1" height="2.1" fill="#fff"/>'
               + '<rect x="9.9" y="7" width="2.1" height="2.1" fill="#fff"/>'
               + '<rect x="6.6" y="11" width="2.1" height="2.1" fill="#fff"/>'
               + '<rect x="9.9" y="11" width="2.1" height="2.1" fill="#fff"/>'
               + '<rect x="15.4" y="12.6" width="2.1" height="2.1" fill="#fff"/>';
  return '<svg class="th-av" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">'
       + (side === "in" ? person : office) + '</svg>';
}

function threadBubble(x) {
  const who = x.side === "in" ? "お客様"
            : (x.side === "out" ? "弊社" : "弊社（この案件の返信案）");
  const long = x.text.length > 220;
  const head = long ? x.text.slice(0, 220) + "…" : x.text;
  return '<div class="th-row ' + x.side + (x.cur ? " cur" : "") + '">'
       +   '<div class="th-who">' + whoIcon(x.side)
       +     '<span>' + esc(who) + (x.at ? "　" + esc(x.at) : "") + '</span></div>'
       +   '<div class="th-bub" data-full="' + esc(x.text) + '">' + esc(head) + '</div>'
       +   (long ? '<button class="th-more" type="button">全文を見る</button>' : "")
       + '</div>';
}

/* ★やりとりを、上から古い順の一本道にして出します。
 *   問い合わせ → 返信 → お客様の返事 … と一段ずつ浮かび上がり、
 *   いちばん下に「いま ここ」と、次にやることを置きます。
 *   文章は最初から入っていて、見え方だけが遅れて付いてきます。
 *   （動きを嫌う設定の端末では、動かさずにすぐ出します） */
function timelineHtml(items, rowNo, hint) {
  const now  = flowIndexOf(rowNo);
  const next = flowNextText(now, hint);

  /* ★「いま ここ」は、いちばん下に別の段を足すのではなく、
   *   返信案の段そのものに付けます。手を入れる場所と「いま ここ」が
   *   離れていると分かりにくいためです。返信案が無いときだけ、
   *   最後に一段足します。 */
  let curIdx = -1;
  items.forEach(function (x, i) {
    if (x.side !== "in" && x.side !== "out") curIdx = i;
  });

  const rows = items.map(function (x, i) {
    const kind = x.side === "in" ? "in" : (x.side === "out" ? "out" : "draft");
    const who  = x.side === "in" ? "お客様からの問い合わせ"
               : (x.side === "out" ? "弊社から返信" : "弊社（この案件の返信案）");
    const isNow = (i === curIdx);

    /* いま手を入れる段は、途中で切らずに見せます */
    const lim  = isNow ? 900 : 220;
    const long = x.text.length > lim;
    const head = long ? x.text.slice(0, lim) + "…" : x.text;

    const inner = '<div class="tl-who">' + whoIcon(x.side) + '<span>' + esc(who) + '</span>'
                +   (isNow ? '<span class="tl-pill">いま ここ</span>'
                           + '<span class="tl-at">' + esc(FLOW_STEPS[now] || "") + '</span>'
                           : (x.at ? '<span class="tl-at">' + esc(x.at) + '</span>' : ""))
                + '</div>'
                + '<div class="tl-text" data-full="' + esc(x.text) + '">' + esc(head) + '</div>'
                + (isNow
                    ? (next ? '<div class="tl-next">' + esc(next) + '</div>' : "")
                      + '<div class="tl-go">ここを押すと、返信を書く画面が開きます</div>'
                    : (long ? '<button class="th-more" type="button">全文を見る</button>' : ""));

    /* 何段あっても待たされないよう、遅れは7段目で頭打ちにします */
    return '<div class="tl-item ' + kind + (isNow ? " now" : "") + '"'
         +   ' style="--i:' + Math.min(i, 6) + '">'
         +   '<span class="tl-dot">' + (isNow ? "今" : (i + 1)) + '</span>'
         +   (isNow
             ? '<button class="tl-card go" id="tlGo" type="button">' + inner + '</button>'
             : '<div class="tl-card">' + inner + '</div>')
         + '</div>';
  }).join("");

  /* 返信案がまだ無いときだけ、最後に「いま ここ」を足します */
  const tail = (curIdx >= 0) ? "" :
      '<div class="tl-item draft now" style="--i:' + Math.min(items.length, 7) + '">'
    +   '<span class="tl-dot">今</span>'
    +   '<button class="tl-card go" id="tlGo" type="button">'
    +     '<div class="tl-who"><span>いま ここ</span>'
    +       '<span class="tl-at">' + esc(FLOW_STEPS[now] || "") + '</span></div>'
    +     (next ? '<div class="tl-next">' + esc(next) + '</div>' : "")
    +     '<div class="tl-go">ここを押すと、返信を書く画面が開きます</div>'
    +   '</button>'
    + '</div>';

  return '<div class="tl">' + rows + tail + '</div>';
}

function drawThread(r) {
  const box  = $("dThread");
  const note = $("dThreadNote");
  let items  = (r && r.items) || [];

  if (!r || !r.ok) {
    box.className = "thread empty-wrap";
    box.innerHTML = '<div class="th-empty">履歴を読み込めませんでした</div>';
    syncDraftBtn();          /* 履歴が読めなくても、返信の文字数は合わせます */
    return;
  }

  const rowNo = cur ? cur.rowNo : null;
  const hint  = (listOpen.concat(listWait, listDone))
    .filter(function (x) { return x.rowNo === rowNo; })[0];

  /* ★上の「今回の問い合わせ」と同じ文が、履歴の1段目にも出ていました。
   *   同じものを二度読ませないよう、一致する段は外します。
   *   空白と改行のちがいは無視して見比べます。 */
  const flat = function (t) { return String(t || "").replace(/\s+/g, ""); };
  const me   = flat(cur && cur.content);
  if (me) {
    let dropped = false;
    items = items.filter(function (x) {
      if (!dropped && x.side === "in" && flat(x.text) === me) { dropped = true; return false; }
      return true;
    });
  }

  /* まだ1件も返ってきていないときは、いま開いている問い合わせを
     最初の一段として使います。時系列の形は崩しません */
  if (!items.length && cur && cur.content) {
    items = [{ side: "in", at: cur.received || "", text: String(cur.content) }];
  }

  box.className = "thread tlwrap";
  note.textContent = items.length > 1
    ? (r.mail || "") + "　" + items.length + "件"
    : (r.mail || "");
  box.innerHTML = timelineHtml(items, rowNo, hint);

  Array.prototype.forEach.call(box.querySelectorAll(".th-more"), function (b) {
    b.addEventListener("click", function () {
      const bub = b.previousElementSibling;
      bub.textContent = bub.dataset.full;
      b.remove();
    });
  });

  const go = box.querySelector("#tlGo");
  if (go) go.addEventListener("click", openWriter);
  syncDraftBtn();
}

/* 返信を書く大きな画面を開きます。#dDraft を押したことにするだけなので、
   保存・送信・AI指示の流れは今までと同じです */
function openWriter() { $("dDraft").click(); }

/* 文字数の出し先（返信の本文の欄）は外しました。
   呼び出し元は複数あるので、関数は残しています */
function syncDraftBtn() {}

async function loadThread() {
  if (!cur) return;
  try { drawThread(await api({ mode: "thread", row: cur.rowNo })); }
  catch (e) { drawThread(null); }
}

/* ============================================================
 *  添付ファイル
 *
 *  ファイルの中身はJSONPでは送れない（URLに載りきらない）ため、
 *  ここだけ POST で送ります。読み書きの他の処理はJSONPのままです。
 * ============================================================ */
function apiPost(params) {
  return fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(params),
    redirect: "follow",
  }).then(function (r) { return r.text(); })
    .then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error("応答が読み取れませんでした"); }
    });
}

let attFiles = [];

function drawAttach() {
  const box = $("dFiles");
  if (!attFiles.length) {
    box.innerHTML = '<div class="att-empty">添付なしで送信します</div>';
    return;
  }
  box.innerHTML = attFiles.map(function (f) {
    const kb = Math.max(1, Math.round(f.size / 1024));
    return '<div class="att-row" data-id="' + esc(f.id) + '">'
         +   '<span class="nm">' + esc(f.name) + '</span>'
         +   '<span class="sz">' + kb + ' KB</span>'
         +   '<button class="rm" type="button">はずす</button>'
         + '</div>';
  }).join("");

  Array.prototype.forEach.call(box.querySelectorAll(".rm"), function (b) {
    b.addEventListener("click", function () {
      const id = b.parentNode.dataset.id;
      dropAttach(id);
    });
  });
}

async function loadAttach() {
  attFiles = [];
  drawAttach();
  if (!cur) return;
  try {
    const r = await api({ mode: "attachList", row: cur.rowNo });
    if (r && r.ok) { attFiles = r.files || []; drawAttach(); }
  } catch (e) { /* 一覧が取れなくても、送信そのものは止めない */ }
}

async function pickAttach(file) {
  if (!cur || !file) return;
  if (attFiles.length >= 2) { setStatus("bad", "添付は2件までです"); return; }
  if (file.size > 5000000) { setStatus("bad", "ファイルが大きすぎます（約5MBまで）"); return; }

  const lab = document.querySelector(".att-pick");
  lab.classList.add("busy");
  setStatus("work", "ファイルを読み込んでいます…");

  try {
    const dataUrl = await new Promise(function (resolve, reject) {
      const rd = new FileReader();
      rd.onload  = function () { resolve(rd.result); };
      rd.onerror = function () { reject(new Error("ファイルを読めませんでした")); };
      rd.readAsDataURL(file);
    });

    setStatus("work", "添付を預けています…");
    const r = await apiPost({ mode: "attach", row: cur.rowNo, name: file.name, data: dataUrl });

    if (!r || !r.ok) {
      setStatus("bad", "添付できませんでした\n理由：" + ((r && r.error) || "（理由が返っていません）"));
      return;
    }
    attFiles = r.files || [];
    drawAttach();
    setStatus("ok", "添付しました：" + file.name);

  } catch (e) {
    setStatus("bad", "添付できませんでした\n理由：" + e.message);
  } finally {
    lab.classList.remove("busy");
    $("dFile").value = "";
  }
}

async function dropAttach(id) {
  if (!cur) return;
  try {
    const r = await api({ mode: "attachDrop", row: cur.rowNo, id: id });
    if (r && r.ok) { attFiles = r.files || []; drawAttach(); setStatus("ok", "添付をはずしました"); }
    else setStatus("bad", "はずせませんでした");
  } catch (e) { setStatus("bad", "はずせませんでした\n理由：" + e.message); }
}

/* ---------- 起動 ---------- */
/* 上の数字を押すと、その並びに切り替わります */
$("btnOpen").addEventListener("click", function () {
  listTab = "open"; lateOnly = false; topicFilter = ""; drawList();
});
$("btnLate").addEventListener("click", function () {
  listTab = "open"; lateOnly = !lateOnly; topicFilter = ""; drawList();
});
$("btnDone").addEventListener("click", function () {
  listTab = "done"; lateOnly = false; topicFilter = ""; drawList();
});

/* 用件の並びを左右に送る */
$("fPrev").addEventListener("click", function () {
  const b = $("filters"); b.scrollLeft -= Math.round(b.clientWidth * 0.8);
});
$("fNext").addEventListener("click", function () {
  const b = $("filters"); b.scrollLeft += Math.round(b.clientWidth * 0.8);
});
$("filters").addEventListener("scroll", syncFilterArrows);
window.addEventListener("resize", syncFilterArrows);

$("tabOpen").addEventListener("click", function () { listTab = "open"; lateOnly = false; topicFilter = ""; drawList(); });
$("tabWait").addEventListener("click", function () { listTab = "wait"; lateOnly = false; topicFilter = ""; drawList(); });
$("tabDone").addEventListener("click", function () { listTab = "done"; lateOnly = false; topicFilter = ""; drawList(); });
$("tabEigyou").addEventListener("click", function () { listTab = "eigyou"; lateOnly = false; topicFilter = ""; drawList(); });
$("tabAnalytics").addEventListener("click", function () { listTab = "stats"; lateOnly = false; topicFilter = ""; drawList(); });
$("dFile").addEventListener("change", function (e) {
  const f = e.target.files && e.target.files[0];
  if (f) pickAttach(f);
});
$("back").addEventListener("click", backToList);

/* 背景をクリック、または Esc で閉じます。
 * ★集中編集が開いているときは、そちらが先に閉じます（二重で閉じません）。 */
$("detailView").addEventListener("mousedown", function (e) {
  if (e.target === $("detailView")) backToList();
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Escape") return;
  if ($("veil").getAttribute("data-open") === "true") return;
  if (!$("detailView").classList.contains("hide")) backToList();
});
$("bSave").addEventListener("click", function () { save(false); });
$("bAi").addEventListener("click", askAi);

/* ───────────────────────────────────────────────────────────────
 * 並べ方（カード／一覧）
 *   ★見え方だけの切り替えです。中身も動きも変わりません。
 *     選んだ形はこの端末に覚えさせるので、次に開いても同じ形で出ます。
 * ─────────────────────────────────────────────────────────────── */
const VIEW_KEY = "crm.view.v1";

function applyView() {
  let rows = false;
  try { rows = localStorage.getItem(VIEW_KEY) === "rows"; } catch (e) {}
  document.body.classList.toggle("view-rows", rows);
  $("bView").textContent = rows ? "カードで見る" : "一覧で見る";
}

$("bView").addEventListener("click", function () {
  const rows = !document.body.classList.contains("view-rows");
  try { localStorage.setItem(VIEW_KEY, rows ? "rows" : "cards"); } catch (e) {}
  applyView();
});
applyView();

$("bSkip").addEventListener("click", skip);
$("bDel").addEventListener("click", delRow);
$("bSend").addEventListener("click", function () { send(false); });
$("bSendWait").addEventListener("click", function () { send(true); });


/* ============================================================
 *  起動
 *
 *  ★URLに ?row=27 が付いていたら、その案件を直接開きます。
 *    LINEの通知から開いたとき、一覧に着地するとどれのことか分かりません。
 *    通知には案件ごとのURLが入っているので、そのまま開けるようにします。
 * ============================================================ */
function bootRow_() {
  try {
    const m = String(location.search || "").match(/[?&]row=(\d+)/);
    return m ? Number(m[1]) : 0;
  } catch (e) { return 0; }
}


/* ============================================================
 *  集中編集
 *
 *  返信本文をクリックすると、背景をぼかした編集画面が開きます。
 *  上部に問い合わせの原文を出すので、見ながら書けます。
 *
 *  ★ #dDraft の値と行き来するだけです。保存・送信・AI指示は
 *    これまでどおり #dDraft を読むので、動きは変わりません。
 * ============================================================ */
(function zenEdit() {
  const main = $("dDraft");
  const veil = $("veil");
  const zen  = $("zenText");
  if (!main || !veil || !zen) return;
  let before = "";

  function tally() { $("zenCount").textContent = zen.value.length.toLocaleString() + " 文字"; }

  function open() {
    if (veil.getAttribute("data-open") === "true") return;
    before = main.value;
    zen.value = main.value;
    /* 詳細の dMeta は「<b>物件名</b>　分類　受信日時」の形です。
       太字の部分を見出しに、残りを小さく添えます。 */
    const bold = $("dMeta").querySelector("b");
    $("zenTitle").textContent = bold ? bold.textContent : "案件";
    $("zenMeta").textContent  = $("dMeta").textContent.replace(bold ? bold.textContent : "", "").trim();
    $("zenAsk").textContent   = ($("dContent") ? $("dContent").textContent : "");
    veil.setAttribute("data-open", "true");
    drawWrap();                      /* 宛名と署名を、上下に出します */
    document.body.style.overflow = "hidden";
    tally();
    fit();
    zen.focus();
    setTimeout(fit, 300);      // キーボードが出きってから、もう一度合わせます
    /* ★以前は文の末尾にカーソルを置いていたため、開いた瞬間に
     *   いちばん下までスクロールしてしまい、頭が見えませんでした。
     *   先頭に合わせて、上から読めるようにします。 */
    try { zen.setSelectionRange(0, 0); } catch (e) {}
    zen.scrollTop = 0;
  }

  /* keep=true … 書いた内容を残す／false … 開く前に戻す */
  function close(keep) {
    main.value = keep ? zen.value : before;
    veil.removeAttribute("data-open");
    veil.style.height = "";
    veil.style.top = "";
    box.classList.remove("kb", "ask-open");
    document.body.style.overflow = "";
    main.blur();
  }

  /* ★スマホでキーボードが出ると、画面の見えている高さが縮みます。
   *   iOSは position:fixed の高さが変わらないため、入力欄が数行に潰れ、
   *   ボタンがキーボードの下に隠れていました。
   *   visualViewport を見て、見えている範囲にぴったり合わせます。 */
  const box = veil.querySelector(".zen");
  function fit() {
    const vv = window.visualViewport;
    if (!vv) return;
    veil.style.height = vv.height + "px";
    veil.style.top    = vv.offsetTop + "px";
    const shrunk = (window.innerHeight - vv.height) > 120;   // キーボードが出ている
    box.classList.toggle("kb", shrunk);
    if (!shrunk) box.classList.remove("ask-open");
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
      if (veil.getAttribute("data-open") === "true") fit();
    });
    window.visualViewport.addEventListener("scroll", function () {
      if (veil.getAttribute("data-open") === "true") fit();
    });
  }

  $("zenPeek").addEventListener("click", function () {
    box.classList.toggle("ask-open");
  });

  main.addEventListener("focus", open);
  main.addEventListener("click", open);
  zen.addEventListener("input", tally);
  $("zenOk").addEventListener("click", function () { close(true); });
  $("zenClose").addEventListener("click", function () { close(true); });
  $("zenBack").addEventListener("click", function () { close(false); });
  veil.addEventListener("mousedown", function (e) { if (e.target === veil) close(true); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && veil.getAttribute("data-open") === "true") close(true);
  });
})();

(function boot() {
  const row = bootRow_();
  loadList();                       // 一覧は裏で読み込んでおく（戻ったときのため）
  if (row >= 2) openDetail(row);    // 指定があれば、その案件をすぐ開く
})();
</script>
