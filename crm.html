<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM 返信の承認</title>
<style>
:root{
  --ink:#1b2430;
  --ink-2:#5b6773;
  --paper:#f6f7f9;
  --card:#ffffff;
  --line:#dde2e8;
  --send:#1f6b53;
  --send-2:#e6f0ec;
  --stop:#a8442a;
  --stop-2:#fbeee9;
  --test:#8a6d3b;
  --test-2:#f6efe1;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.75;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 60px}

/* ---- 見出し ---- */
header{
  position:sticky; top:0; z-index:10;
  background:var(--paper); border-bottom:1px solid var(--line);
  padding:12px 0 10px; margin-bottom:14px;
}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:17px;margin:0;letter-spacing:.02em;flex:1}
.badge{
  font-size:12px;padding:3px 9px;border-radius:999px;
  background:var(--test-2); color:var(--test); border:1px solid #e0d3b4;
  white-space:nowrap;
}
.badge.live{background:var(--stop-2);color:var(--stop);border-color:#e8cabe}
.count{font-size:13px;color:var(--ink-2)}

/* ---- 一覧 ---- */
.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius); padding:13px 14px; margin-bottom:10px;
  cursor:pointer; transition:border-color .12s;
}
.card:hover,.card:focus-visible{border-color:#b9c2cc;outline:none}
.card-top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.kind{
  font-size:12px;padding:2px 8px;border-radius:4px;
  background:#eef1f4;color:var(--ink-2);white-space:nowrap;
}
.kind.soudan{background:#e8f0ee;color:var(--send)}
.bldg{font-weight:600;font-size:15px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:12px;color:var(--ink-2);white-space:nowrap}
.snip{
  font-size:13px;color:var(--ink-2);margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.6;
}

/* ---- 詳細 ---- */
.back{
  background:none;border:none;padding:6px 0;margin:0 0 6px;
  color:var(--ink-2);font-size:14px;cursor:pointer;font-family:inherit;
}
.back:hover{color:var(--ink)}
.sec{margin-bottom:18px}
.sec>h2{
  font-size:12px;font-weight:600;color:var(--ink-2);
  margin:0 0 6px;letter-spacing:.06em;
}
.box{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 14px;
  white-space:pre-wrap;word-break:break-word;font-size:14px;
}
.box.quiet{background:#fbfcfd;color:var(--ink-2);font-size:13px}
textarea{
  width:100%;min-height:230px;padding:12px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  font-family:inherit;font-size:14px;line-height:1.8;color:var(--ink);
  resize:vertical;
}
textarea:focus{outline:2px solid #b9c9d6;outline-offset:-1px;border-color:#b9c9d6}
.meta{font-size:13px;color:var(--ink-2);margin:0 0 2px}
.meta b{color:var(--ink);font-weight:600}

/* ---- ボタン ---- */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.act{
  font-family:inherit;font-size:15px;font-weight:600;
  padding:12px 18px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;transition:.12s;
}
button.act:hover{border-color:#b9c2cc}
button.act:disabled{opacity:.45;cursor:default}
button.send{background:var(--send);border-color:var(--send);color:#fff;flex:1;min-width:150px}
button.send:hover{background:#175843;border-color:#175843}
button.send.armed{background:var(--stop);border-color:var(--stop)}
button.skip{color:var(--stop);border-color:#e8cabe;background:var(--stop-2)}

/* ---- 通知 ---- */
.toast{
  position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:14px;
  padding:11px 20px;border-radius:999px;z-index:50;
  max-width:90vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.toast.on{opacity:1}
.toast.bad{background:var(--stop)}

/* ---- 結果表示（消えません） ---- */
.status{
  margin-top:14px;padding:11px 14px;border-radius:var(--radius);
  font-size:14px;line-height:1.65;border:1px solid;
  white-space:pre-wrap;word-break:break-word;
}
.status .stamp{display:block;font-size:12px;opacity:.75;margin-top:3px}
.status.ok{background:var(--send-2);color:var(--send);border-color:#bcd8cd}
.status.bad{background:var(--stop-2);color:var(--stop);border-color:#e8cabe}
.status.work{background:#eef1f4;color:var(--ink-2);border-color:var(--line)}

.buildtag{font-size:11px;color:var(--ink-2);opacity:.7;letter-spacing:.03em}

.empty{text-align:center;color:var(--ink-2);padding:50px 20px;font-size:14px}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hd">
      <h1>CRM 返信の承認</h1>
      <span class="badge" id="mode">確認中</span>
    </div>
    <div class="count" id="count"></div>
    <div class="buildtag" id="buildtag"></div>
  </header>

  <!-- 一覧 -->
  <section id="listView">
    <div id="list"></div>
  </section>

  <!-- 詳細 -->
  <section id="detailView" class="hide">
    <button class="back" id="back">← 一覧にもどる</button>

    <div class="sec">
      <p class="meta" id="dMeta"></p>
      <p class="meta" id="dSubject"></p>
    </div>

    <div class="sec">
      <h2>お客様からの問い合わせ</h2>
      <div class="box quiet" id="dContent"></div>
    </div>

    <div class="sec">
      <h2>返信の本文（ここを直せます）</h2>
      <textarea id="dDraft" spellcheck="false"></textarea>
    </div>

    <div class="sec">
      <h2>実際に送られる形</h2>
      <div class="box" id="dPreview"></div>
    </div>

    <div class="status hide" id="status"></div>

    <div class="acts">
      <button class="act" id="bSave">下書きを保存</button>
      <button class="act skip" id="bSkip">対応しない</button>
      <button class="act send" id="bSend">送信する</button>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbws85BB01CV2U4yJO6z3gHnH5ZjQp0rPviQ_XTpGR2c5p5uxJUKCwxz_M47y3TViLD1/exec";

/* ---------- APIを呼ぶ（JSONP） ---------- */
let jsonpSeq = 0;
function api(params) {
  return new Promise(function (resolve, reject) {
    const cb = "__crm_cb_" + (++jsonpSeq) + "_" + Date.now();
    const s  = document.createElement("script");
    let done = false;

    const timer = setTimeout(function () {
      if (done) return;
      cleanup();
      reject(new Error("応答がありません。通信状況を確認してください"));
    }, 25000);

    function cleanup() {
      done = true;
      clearTimeout(timer);
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
    }

    window[cb] = function (data) { cleanup(); resolve(data); };

    const q = Object.keys(params)
      .map(function (k) { return k + "=" + encodeURIComponent(params[k]); })
      .join("&");

    s.src = API + "?" + q + "&callback=" + cb;
    s.onerror = function () { if (!done) { cleanup(); reject(new Error("接続できません")); } };
    document.head.appendChild(s);
  });
}

/* ---------- 画面の部品 ---------- */
const UI_BUILD = "ui-2026-08-16c";
const $ = function (id) { return document.getElementById(id); };
let rows = [];
let cur  = null;
let isTest = true;

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast on" + (bad ? " bad" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.className = "toast"; }, 3200);
}

/* 結果を画面に残す。トーストと違い、自動では消えません */
function setStatus(kind, msg) {
  const el = $("status");
  if (!kind) { el.className = "status hide"; el.textContent = ""; return; }
  const d = new Date();
  const hh = ("0" + d.getHours()).slice(-2), mm = ("0" + d.getMinutes()).slice(-2),
        ss = ("0" + d.getSeconds()).slice(-2);
  el.className = "status " + kind;
  el.textContent = msg;
  const t = document.createElement("span");
  t.className = "stamp";
  t.textContent = hh + ":" + mm + ":" + ss;
  el.appendChild(t);
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- 一覧 ---------- */
async function loadList() {
  $("list").innerHTML = '<div class="empty">読み込んでいます…</div>';
  try {
    const r = await api({ mode: "list" });
    if (!r.ok) throw new Error(r.error || "読み込めませんでした");

    rows   = r.rows || [];
    isTest = !!r.test;

    $("mode").textContent = isTest ? "テスト送信中" : "本番送信";
    $("mode").className   = isTest ? "badge" : "badge live";
    $("buildtag").textContent = "画面 " + UI_BUILD + " ／ API " + (r.build || "?");
    $("count").textContent = rows.length
      ? "承認を待っている案件が " + rows.length + " 件あります"
      : "";

    if (!rows.length) {
      $("list").innerHTML = '<div class="empty">承認を待っている案件はありません</div>';
      return;
    }

    $("list").innerHTML = rows.map(function (x, i) {
      const soudan = x.kind === "入居者相談" ? " soudan" : "";
      const snip   = x.draft.replace(/\s+/g, " ").slice(0, 90);
      return '<div class="card" tabindex="0" data-i="' + i + '">'
           +   '<div class="card-top">'
           +     '<span class="kind' + soudan + '">' + esc(x.kind || "未分類") + '</span>'
           +     '<span class="bldg">' + esc(x.building || "物件名なし") + '</span>'
           +     '<span class="time">' + esc(x.received) + '</span>'
           +   '</div>'
           +   '<p class="snip">' + esc(snip) + '</p>'
           + '</div>';
    }).join("");

    Array.prototype.forEach.call($("list").querySelectorAll(".card"), function (el) {
      el.addEventListener("click", function () { openDetail(rows[el.dataset.i].rowNo); });
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault(); openDetail(rows[el.dataset.i].rowNo);
        }
      });
    });

  } catch (e) {
    $("list").innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

/* ---------- 詳細 ---------- */
async function openDetail(rowNo) {
  try {
    const d = await api({ mode: "detail", row: rowNo });
    if (!d.ok) { toast(d.error, true); return; }

    cur = d;
    $("dMeta").innerHTML    = "<b>" + esc(d.building || "物件名なし") + "</b>　"
                            + esc(d.kind) + "　" + esc(d.received);
    $("dSubject").innerHTML = "件名：" + esc(d.subject);
    $("dContent").textContent = d.content;
    $("dDraft").value         = d.draft;
    $("dPreview").textContent = d.preview;

    setStatus(null);
    disarm();
    $("listView").classList.add("hide");
    $("detailView").classList.remove("hide");
    window.scrollTo(0, 0);

  } catch (e) { toast(e.message, true); }
}

function backToList() {
  $("detailView").classList.add("hide");
  $("listView").classList.remove("hide");
  cur = null;
  loadList();
}

/* ---------- 保存 ---------- */
async function save(silent) {
  if (!cur) return false;
  const text = $("dDraft").value.trim();
  if (!text) { setStatus("bad", "本文が空です。保存しませんでした。"); return false; }

  const b = $("bSave");
  const label = b.textContent;
  b.disabled = true;
  b.textContent = "保存しています…";
  setStatus("work", silent ? "送信の前に下書きを保存しています…" : "下書きを保存しています…");

  try {
    const r = await api({ mode: "save", row: cur.rowNo, text: text });
    if (!r.ok) {
      setStatus("bad", "保存できませんでした\n理由：" + (r.error || "（理由が返っていません）"));
      return false;
    }
    cur.draft = text;
    setStatus("ok", silent
      ? "下書きを保存しました。つづけて送信できます。"
      : "下書きを保存しました（" + cur.rowNo + "行目）");
    return true;
  } catch (e) {
    setStatus("bad", "保存できませんでした\n理由：" + e.message);
    return false;
  } finally {
    b.disabled = false;
    b.textContent = label;
  }
}

/* ---------- 対応しない ---------- */
async function skip() {
  if (!cur) return;
  if (!confirm("この案件に返信しません。よろしいですか？")) return;

  const b = $("bSkip");
  b.disabled = true;
  b.textContent = "記録しています…";
  setStatus("work", "対応しないものとして記録しています…");

  try {
    const r = await api({ mode: "skip", row: cur.rowNo });
    if (!r.ok) {
      setStatus("bad", "記録できませんでした\n理由：" + (r.error || "（理由が返っていません）"));
      b.disabled = false; b.textContent = "対応しない";
      return;
    }
    setStatus("ok", "対応しないものとして記録しました。一覧にもどります。");
    setTimeout(backToList, 1400);
  } catch (e) {
    setStatus("bad", "記録できませんでした\n理由：" + e.message);
    b.disabled = false; b.textContent = "対応しない";
  }
}

/* ---------- 送信 ----------
 *  以前は「2回押す」方式でしたが、通信に1〜2秒かかるため
 *  1回目の保存中にもう一度押すと、送信段階に進めませんでした。
 *  確認ダイアログ方式に変更し、押した瞬間にボタンを止めます。
 */
function disarm() {                     // 残っている呼び出し先（何もしません）
  const b = $("bSend");
  if (b) { b.disabled = false; b.textContent = "送信する"; b.classList.remove("armed"); }
}

async function send() {
  if (!cur) return;
  const b = $("bSend");
  if (b.disabled) return;               // 連打を無視します

  b.disabled = true;
  b.textContent = "準備しています…";

  try {
    const ok = await save(true);        // 送信前に必ず保存
    if (!ok) return;

    const q = isTest
      ? "テスト送信します。\n\n宛先はテスト用アドレスです。\nお客様には届きません。\n\nよろしいですか？"
      : "★本番送信します。\n\n" + cur.from + " に実際に届きます。\n\nよろしいですか？";

    if (!confirm(q)) {
      setStatus("work", "送信を取りやめました。まだ送っていません。");
      return;
    }

    b.textContent = "送信しています…";
    b.classList.add("armed");
    setStatus("work", "送信しています…（1〜2秒かかります）");

    const r = await api({ mode: "send", row: cur.rowNo });

    if (!r || !r.ok) {
      setStatus("bad", "送信できませんでした\n理由：" +
        ((r && r.error) ? r.error : JSON.stringify(r)));
      return;
    }

    setStatus("ok", r.test
      ? "テスト送信しました。\n宛先：" + r.to +
        "\n（お客様には届いていません。台帳も更新していません）"
      : "送信しました。\n宛先：" + r.to + "\n台帳を「送信済」に更新しました。");
    setTimeout(backToList, 2600);

  } catch (e) {
    setStatus("bad", "送信できませんでした\n理由：" + e.message);
  } finally {
    b.disabled = false;
    b.textContent = "送信する";
    b.classList.remove("armed");
  }
}

/* ---------- 起動 ---------- */
$("back").addEventListener("click", backToList);
$("bSave").addEventListener("click", function () { save(false); });
$("bSkip").addEventListener("click", skip);
$("bSend").addEventListener("click", send);


loadList();
</script>
</body>
</html>
